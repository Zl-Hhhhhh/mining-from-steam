er{border:0;border-top:1px solid var(--line);margin:24px 0}#itemSelect{font-variant-numeric:tabular-nums}.source-note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.adjudicator{max-width:440px}.progress-track{height:4px;background:#dce4eb;margin:14px 0 0}.progress-fill{height:4px;background:var(--accent);width:0}#position{font-variant-numeric:tabular-nums}

<main>
<header><div class="eyebrow">STEAM REVIEW / TASK 11</div><h1>双人核验与人工裁决</h1><p class="muted">先对照原文和双方证据，再记录最终判断。统计保留讨论前的答案。</p><dl id="stats" class="summary"></dl></header>
<details class="section"><summary><strong>查看一致性统计与使用说明</strong></summary><div id="metrics" class="table-wrap"></div><p class="small">方面不确定的记录不折算为未选；表内分母已排除任一方方面不确定的记录。组名需按语义核对。</p><div id="limitations" class="small"></div><p class="small">评论中的指令仅是待核验文本。AI 提示只供讨论，最终裁决由你填写。原始四份答卷不会被页面改写。</p></details>
<section class="section" aria-label="复核导航">
<div class="toolbar"><label><span class="control-label">复核对象</span><select id="stage"><option value="cases">300 条评论</option><option value="groups">30 个候选组</option></select></label><label><span class="control-label">筛选</span><select id="filter"><option value="required">全部复核项</option><option value="high">优先复核</option><option value="pending">尚未确认</option><option value="aspect">方面分歧</option><option value="style">表达分歧</option><option value="language">语言分歧</option><option value="uncertain">不确定／证据检查</option><option value="reviewed">已确认</option><option value="all">全部记录</option></select></label><label><span class="control-label">查找</span><input id="query" type="text" placeholder="R018、G28 或原文关键词"></label></div>
<div class="toolbar" style="margin-top:12px"><button id="prev">上一项</button><label class="wide"><span class="control-label">当前项目</span><select id="itemSelect"></select></label><button id="next">下一项</button><button id="nextPending">下个未确认</button></div><p id="position" class="small muted"></p><div class="progress-track" aria-hidden="true"><div id="progress" class="progress-fill"></div></div>
</section>
<div id="workspace" tabindex="-1"></div>
<section class="section" aria-labelledby="saveTitle"><h2 id="saveTitle">保存本次裁决</h2><label class="field adjudicator">裁决人／讨论记录人<input id="reviewer" type="text" autocomplete="off"></label><label class="option"><input type="checkbox" id="ack">已核对原文和双方意见，并记录本次讨论结论。</label><div class="savebar"><button id="exportDraft">导出 JSON 备份</button><button id="exportComplete" class="primary">检查并导出完成 JSON</button><label class="field">导入裁决备份<input id="importFile" type="file" accept=".json"></label></div><p id="storageWarning" class="error" hidden>浏览器无法自动保存。离开前请导出 JSON 备份。</p><p id="message" class="message" role="status" aria-live="polite"></p><p class="source-note">本页离线工作。浏览器自动保存不能替代导出备份。完成文件允许记录“不确定”，但不代表 Task12 已冻结主题。</p></section>
</main>
<script id="review-data" type="application/json">__REVIEW_PAYLOAD__</script>
<script>
'use strict';
const P=JSON.parse(document.getElementById('review-data').textContent),L=P.labels;
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
const key=P.package_id+':adjudication:'+P.source_fingerprint+(P.assignment?':'+P.assignment.assignment_sha256:'')+(P.review_session_id?':'+P.review_session_id:'');
if(P.decision_context){const notice=document.createElement('p');notice.className='callout warn';notice.textContent=P.decision_context;document.querySelector('header').append(notice)}
const groupUniverse=P.group_reference||P.groups;
const lang={english:'英语',schinese:'中文',mixed:'混合',other:'其他语言',uncertain:'无法判断'};
const presence={yes:'有具体方面',no:'没有具体方面',uncertain:'不确定'};
const styles={ordinary:'普通表达',special:'特殊表达',uncertain:'表达不确定'};
const kinds=Object.fromEntries(L.group_kinds),reasons=Object.fromEntries([...L.no_reasons,...L.uncertain_reasons]);
const fields={observed_language:'语言',aspect_presence:'有无具体方面',aspect_labels:'方面标签',reason:'原因',expression_status:'表达状态',expression_flags:'表达标记'};
const actions={retain:'保留',merge:'合并',split:'拆分',rework:'重做／重新分组',generic:'泛评，不设具体主题',uncertain:'暂不确定'};
let state=clone(P.initial_decisions),view={stage:'cases',filter:'required',query:'',id:null},filtered=[];
const stable=x=>Array.isArray(x)?x.map(stable):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,stable(x[k])])):x;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=(s,cls='')=>'<span class="tag '+cls+'">'+esc(s)+'</span>';
function message(s,error=false){$('message').textContent=s;$('message').className='message'+(error?' error':'')}
function persist(){state.complete=false;try{localStorage.setItem(key,JSON.stringify(state))}catch(e){$('storageWarning').hidden=false}updateProgress()}
function blankCase(){return {observed_language:'',aspect_presence:'',aspect_labels:[],aspect_evidence:{},reason:'',expression_status:'',expression_flags:[],style_evidence:'',notes:''}}
function blankGroup(){return {group_kind:'',coherence_rating:null,proposed_name:'',notes:''}}
function caseErrors(a){if(!a||typeof a!=='object'||Array.isArray(a))return ['请选择或填写最终判断'];let e=[];if(!(a.observed_language in lang))e.push('请选择实际语言');if(!(a.aspect_presence in presence))e.push('请选择有无具体方面');if(!Array.isArray(a.aspect_labels)||a.aspect_labels.some(x=>!L.aspects[x])||new Set(a.aspect_labels).size!==a.aspect_labels.length)return ['方面标签格式错误'];if(!a.aspect_evidence||typeof a.aspect_evidence!=='object'||Array.isArray(a.aspect_evidence))return ['方面证据格式错误'];if(a.aspect_presence==='yes'&&!a.aspect_labels.length)e.push('至少选择一个方面');if(a.aspect_presence==='no'&&a.aspect_labels.length)e.push('无方面时请清空标签');if(a.aspect_presence==='no'&&!L.no_reasons.some(x=>x[0]===a.reason))e.push('请选择无方面原因');if(a.aspect_presence==='uncertain'&&!L.uncertain_reasons.some(x=>x[0]===a.reason))e.push('请选择不确定原因');if((a.aspect_presence==='uncertain'||a.aspect_labels.includes('other_concrete'))&&!String(a.notes||'').trim())e.push('请补充方面说明');if(a.aspect_labels.some(k=>!String(a.aspect_evidence[k]||'').trim()))e.push('每个方面都需原文证据');if(!(a.expression_status in styles))e.push('请选择表达状态');if(!Array.isArray(a.expression_flags)||a.expression_flags.some(x=>!L.styles[x])||new Set(a.expression_flags).size!==a.expression_flags.length)return ['表达标记格式错误'];if(a.expression_status==='ordinary'&&a.expression_flags.length)e.push('普通表达不能保留特殊标记');if(a.expression_status==='special'&&!a.expression_flags.length)e.push('请选择特殊表达标记');if(['special','uncertain'].includes(a.expression_status)&&!String(a.style_evidence||'').trim())e.push('请填写表达证据或不确定说明');return e}
function groupErrors(a){if(!a||typeof a!=='object'||Array.isArray(a))return ['请选择或填写最终判断'];let e=[];if(!kinds[a.group_kind])e.push('请选择组性质');if(![0,1,2].includes(a.coherence_rating))e.push('请选择具体方面一致性评分');if(!String(a.proposed_name||'').trim())e.push('请写最终名称');if(!String(a.notes||'').trim())e.push('请写方面依据');return e}
function decisionErrors(row,stage,recordId=view.id){if(!row||typeof row!=='object')return ['缺少裁决'];let e=(stage==='cases'?caseErrors:groupErrors)(row.final_answer);if(!String(row.rationale||'').trim())e.push('请简要说明本次裁决理由');if(stage==='cases'&&['A','B'].includes(row.basis)&&JSON.stringify(stable(row.final_answer))!==JSON.stringify(stable(P.cases.find(r=>r.id===recordId)?.[row.basis])))e.push('判断已修改，请选择综合判断');if(stage==='cases'&&!['A','B','custom'].includes(row.basis))e.push('请选择判断来源');if(stage==='groups'){if(!actions[row.action])e.push('请选择处理方式');const related=row.related_groups||[];if(!Array.isArray(related)||related.some(x=>!groupUniverse.some(g=>g.id===x)||x===recordId))e.push('关联组编号无效');if(row.action==='merge'&&!related.length)e.push('合并时请填写关联组编号')}return e}
function importErrors(data){let e=[];if(typeof data?.complete!=='boolean')e.push('完成状态格式无效');if(!data||data.stage!=='adjudication'||data.schema_version!=='1.0')return ['裁决文件格式不正确'];if(P.assignment){if(data.scope!=='assignment'||data.assignment_id!==P.assignment.id||data.assignment_sha256!==P.assignment.assignment_sha256)e.push('分任务编号或来源不匹配');for(const stage of ['cases','groups']){const expected=P[stage].map(r=>r.id),actual=Object.keys(data[stage]||{});if(expected.length!==actual.length||expected.some(id=>!actual.includes(id)))e.push('必须恰好包含本份分配的编号')}}else if((data.scope||'full')!=='full')e.push('分任务文件请先合并');for(const k of ['package_id','sample_sha256','source_fingerprint'])if(data[k]!==P[k])e.push('来源不匹配：'+k);for(const stage of ['cases','groups']){if(!data[stage]||typeof data[stage]!=='object'||Array.isArray(data[stage])){e.push(stage+' 格式不正确');continue}for(const [id,row] of Object.entries(data[stage])){if(!P[stage].some(x=>x.id===id)){e.push('未知编号 '+id);continue}if(!row||!['pending','reviewed'].includes(row.status)){e.push(id+' 状态无效');continue}if(row.status==='reviewed')e.push(...decisionErrors(row,stage,id).map(s=>id+'：'+s))}}if(data.complete){if(!String(data.reviewer||'').trim()||data.acknowledged_review!==true)e.push('缺少裁决人或确认');for(const stage of ['cases','groups'])for(const r of P[stage])if(r.requires_review&&data[stage]?.[r.id]?.status!=='reviewed')e.push(r.id+' 尚未复核')}return e}
try{const saved=localStorage.getItem(key);if(saved){const data=JSON.parse(saved),errors=importErrors({...data,complete:false});if(!errors.length)state=data;else message('未恢复格式不符的本地缓存，请导入有效备份。',true)}}catch(e){$('storageWarning').hidden=false}
function current(){return P[view.stage].find(r=>r.id===view.id)}
function rowFor(r=current()){if(!r)return null;const stage=view.stage;if(!state[stage][r.id])state[stage][r.id]=stage==='cases'?{status:'pending',basis:'',final_answer:null,rationale:''}:{status:'pending',action:'',related_groups:[],final_answer:null,rationale:''};return state[stage][r.id]}
function dirty(row){row.status='pending';persist();$('confirmedState').textContent='编辑中，尚未确认';$('confirmedState').className='tag warn'}
function updateProgress(){const count=stage=>P[stage].filter(r=>r.requires_review&&state[stage][r.id]?.status==='reviewed').length;const required=P.counts.cases_requiring_review+P.groups.length,done=count('cases')+count('groups');$('stats').innerHTML='<div><dt>评论复核范围</dt><dd>'+P.counts.cases_requiring_review+' <small>/ '+(P.population_counts?.cases||P.counts.cases_total)+'</small></dd></div><div><dt>候选组复核范围</dt><dd>'+P.groups.length+' <small>/ '+(P.population_counts?.groups||P.groups.length)+'</small></dd></div><div><dt>本次已确认</dt><dd>'+done+' <small>/ '+required+'</small></dd></div><div><dt>有无方面一致率</dt><dd>'+(P.metrics.cases.aspect_presence.agreement*100).toFixed(1)+'<small>%</small></dd></div>';$('progress').style.width=(100*done/required)+'%'}
function visible(r){const done=state[view.stage][r.id]?.status==='reviewed',d=r.differences;let ok=true;switch(view.filter){case 'required':ok=r.requires_review;break;case 'pending':ok=r.requires_review&&!done;break;case 'high':ok=r.requires_review&&r.priority==='high';break;case 'reviewed':ok=done;break;case 'aspect':ok=view.stage==='groups'||d.some(k=>['aspect_presence','aspect_labels','reason'].includes(k));break;case 'style':ok=view.stage==='cases'&&d.some(k=>['expression_status','expression_flags'].includes(k));break;case 'language':ok=view.stage==='cases'&&d.includes('observed_language');break;case 'uncertain':ok=r.checks.length>0;break}if(view.query){const q=view.query.toLowerCase();ok=ok&&JSON.stringify(r).toLowerCase().includes(q)}return ok}
function labelFor(r){const d=state[view.stage][r.id]?.status==='reviewed';return r.id+' · '+(d?'已确认':r.requires_review?'待确认':'双方判断相同')+' · '+(view.stage==='cases'?r.text.replace(/\s+/g,' ').slice(0,46):r.A.proposed_name+' / '+r.B.proposed_name)}
function refresh(){filtered=P[view.stage].filter(visible).sort((a,b)=>(a.priority==='high'?0:1)-(b.priority==='high'?0:1)||a.id.localeCompare(b.id));if(!filtered.some(r=>r.id===view.id))view.id=filtered[0]?.id||null;$('itemSelect').innerHTML=filtered.map(r=>'<option value="'+r.id+'">'+esc(labelFor(r))+'</option>').join('');$('itemSelect').value=view.id||'';const index=filtered.findIndex(r=>r.id===view.id);$('position').textContent=filtered.length?'当前筛选 '+filtered.length+' 项，第 '+(index+1)+' 项。确认后可继续下一项。':'当前筛选没有项目。';$('prev').disabled=index<=0;$('next').disabled=index<0||index>=filtered.length-1;render();updateProgress()}
function answerHTML(a,stage){if(stage==='groups')return '<dl class="answer"><dt>组性质／评分</dt><dd>'+esc(kinds[a.group_kind])+' · '+a.coherence_rating+' 分</dd><dt>建议名称</dt><dd>'+esc(a.proposed_name)+'</dd><dt>依据与处理意见</dt><dd>'+esc(a.notes)+'</dd></dl>';const evidence=a.aspect_labels.map(k=>'<dt>'+esc(L.aspects[k])+'</dt><dd>'+esc(a.aspect_evidence[k])+'</dd>').join('');return '<dl class="answer"><dt>实际语言／方面状态</dt><dd>'+esc(lang[a.observed_language])+' · '+esc(presence[a.aspect_presence])+'</dd>'+evidence+(a.aspect_presence!=='yes'?'<dt>原因</dt><dd>'+esc(reasons[a.reason]||a.reason)+'</dd>':'')+'<dt>方面说明</dt><dd>'+esc(a.notes||'无')+'</dd><dt>表达方式</dt><dd>'+esc(styles[a.expression_status])+' · '+esc(a.expression_flags.map(k=>L.styles[k]).join('、')||'无特殊标记')+'</dd><dt>表达证据／说明</dt><dd>'+esc(a.style_evidence||'无')+'</dd></dl>'}
function render(){const r=current();if(!r){$('workspace').innerHTML='<section class="section"><p>没有符合筛选条件的项目。</p></section>';return}const row=rowFor(r);let tags=r.differences.map(k=>tag(fields[k]||({'group_kind':'组性质','coherence_rating':'评分'}[k])+'不同','warn')).join('');if(!tags)tags=tag('类别判断相同');if(r.priority==='high')tags=tag('优先复核','warn')+tags;let original='';if(view.stage==='cases')original='<details open><summary><strong>评论原文</strong></summary><div class="review-text">'+esc(r.text)+'</div></details>';else original='<div id="examples">'+r.examples.map(e=>'<details class="example"><summary><strong>'+esc(e.id)+'</strong> '+tag(e.kind==='center'?'中心例子':'随机例子')+' '+esc(e.text.replace(/\s+/g,' ').slice(0,62))+'</summary><div class="review-text">'+esc(e.text)+'</div></details>').join('')+'</div><button id="expandExamples">展开全部例子</button>';const checkHTML=r.checks.length?'<ul class="checks">'+r.checks.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';const guide=view.stage==='groups'&&r.guidance?'<div class="callout warn"><strong>AI 分析提示，待人工确认</strong><p>'+esc(r.guidance.question)+'</p><p>'+esc(r.guidance.note)+'</p><p>可讨论：'+esc(r.guidance.suggested_action)+'</p></div>':'';$('workspace').innerHTML='<section class="section"><h2>'+esc(r.id)+' '+tags+'</h2>'+checkHTML+original+'</section><section class="section"><div class="compare"><section><h3>A · 原始答卷</h3>'+answerHTML(r.A,view.stage)+'</section><section><h3>B · 原始答卷</h3>'+answerHTML(r.B,view.stage)+'</section></div></section><section class="section">'+guide+'<h2 style="margin-top:16px">本次人工裁决 <span id="confirmedState" class="tag '+(row.status==='reviewed'?'ok':'warn')+'">'+(row.status==='reviewed'?'已确认':'尚未确认')+'</span></h2><div class="toolbar"><button id="adoptA">采用 A 的判断</button><button id="adoptB">采用 B 的判断</button><button id="custom">另写／综合判断</button></div><div id="finalForm"></div><label class="field">本次裁决／处理理由<textarea id="rationale" placeholder="简要说明依据、保留的不确定或例子编号。"></textarea></label><p id="itemErrors" class="er function options(values,currentValue){return '<option value="">请选择</option>'+Object.entries(values).map(([k,v])=>'<option value="'+esc(k)+'"'+(String(currentValue)===k?' selected':'')+'>'+esc(v)+'</option>').join('')}

function renderForm(){const row=rowFor(),a=row.final_answer;if(!a){$('finalForm').innerHTML='<p class="muted">选择采用一方判断，或另写综合判断。所有裁决均需你主动确认。</p>';return}if(view.stage==='groups'){$('finalForm').innerHTML='<div class="form-grid">'+selectField('f_kind','最终组性质',kinds,a.group_kind)+selectField('f_score','当前六例的具体方面一致性',{'0':'0：无共同具体方面','1':'1：部分一致','2':'2：较一致'},a.coherence_rating)+textField('f_name','最终名称',a.proposed_name)+selectField('f_action','处理方式',actions,row.action)+textField('f_related','关联组编号（合并时必填）',(row.related_groups||[]).join('、'))+'</div>'+textField('f_notes','方面依据、支持与反例',a.notes,true);for(const [id,k] of [['f_kind','group_kind'],['f_name','proposed_name'],['f_notes','notes']])$(id).oninput=()=>{a[k]=$(id).value;dirty(row)};$('f_score').onchange=()=>{a.coherence_rating=$('f_score').value===''?null:Number($('f_score').value);dirty(row)};$('f_action').onchange=()=>{row.action=$('f_action').value;dirty(row)};$('f_related').oninput=()=>{row.related_groups=$('f_related').value.toUpperCase().split(/[\s,，、;；]+/).filter(Boolean);dirty(row)};return}
const aspectOptions=Object.entries(L.aspects).map(([k,v])=>'<label class="option"><input data-aspect="'+k+'" type="checkbox"'+(a.aspect_labels.includes(k)?' checked':'')+'>'+esc(v)+'</label>').join('');const styleOptions=Object.entries(L.styles).map(([k,v])=>'<label class="option"><input data-style="'+k+'" type="checkbox"'+(a.expression_flags.includes(k)?' checked':'')+'>'+esc(v)+'</label>').join('');$('finalForm').innerHTML='<div class="form-grid">'+selectField('f_lang','最终实际语言',lang,a.observed_language)+selectField('f_presence','最终有无具体方面',presence,a.aspect_presence)+'</div>'+(a.aspect_presence!=='yes'?selectField('f_reason','无方面／不确定原因',Object.fromEntries(a.aspect_presence==='no'?L.no_reasons:L.uncertain_reasons),a.reason):'')+'<p class="control-label">最终方面标签</p><div class="options">'+aspectOptions+'</div>'+a.aspect_labels.map(k=>'<div class="evidence">'+textField('ev_'+k,L.aspects[k]+' · 原文证据',a.aspect_evidence[k]||'')+'</div>').join('')+textField('f_notes','其他方面说明／不确定原因',a.notes,true)+selectField('f_style','最终表达状态',styles,a.expression_status)+'<div class="options">'+styleOptions+'</div>'+textField('f_style_evidence','表达证据／不确定说明',a.style_evidence,true);
for(const [id,k] of [['f_lang','observed_language'],['f_reason','reason'],['f_notes','notes'],['f_style_evidence','style_evidence']])if($(id))$(id).oninput=()=>{a[k]=$(id).value;row.basis='custom';dirty(row)};$('f_presence').onchange=()=>{a.aspect_presence=$('f_presence').value;a.reason='';if(a.aspect_presence==='no'){a.aspect_labels=[];a.aspect_evidence={}}row.basis='custom';dirty(row);renderForm()};$('f_style').onchange=()=>{a.expression_status=$('f_style').value;if(a.expression_status==='ordinary')a.expression_flags=[];row.basis='custom';dirty(row);renderForm()};document.querySelectorAll('[data-aspect]').forEach(el=>el.onchange=()=>{a.aspect_labels=[...document.querySelectorAll('[data-aspect]:checked')].map(x=>x.dataset.aspect);row.basis='custom';dirty(row);renderForm()});document.querySelectorAll('[data-style]').forEach(el=>el.onchange=()=>{a.expression_flags=[...document.querySelectorAll('[data-style]:checked')].map(x=>x.dataset.style);row.basis='custom';dirty(row)});for(const k of a.aspect_labels)$('ev_'+k).oninput=()=>{a.aspect_evidence[k]=$('ev_'+k).value;row.basis='custom';dirty(row)}}
function confirmNext(){const row=rowFor(),errors=decisionErrors(row,view.stage);$('itemErrors').textContent=errors.join('\n');if(errors.length)return;const oldId=view.id,index=filtered.findIndex(r=>r.id===oldId);row.status='reviewed';persist();view.id=filtered[index+1]?.id||oldId;refresh();message(oldId+' 已确认。')}
$('stage').onchange=()=>{view.stage=$('stage').value;view.id=null;refresh()};$('filter').onchange=()=>{view.filter=$('filter').value;view.id=null;refresh()};$('query').oninput=()=>{view.query=$('query').value.trim();view.id=null;refresh()};$('itemSelect').onchange=()=>{view.id=$('itemSelect').value;refresh()};$('prev').onclick=()=>{const n=filtered.findIndex(r=>r.id===view.id);if(n>0)view.id=filtered[n-1].id;refresh()};$('next').onclick=()=>{const n=filtered.findIndex(r=>r.id===view.id);if(n<filtered.length-1)view.id=filtered[n+1].id;refresh()};$('nextPending').onclick=()=>{const n=filtered.findIndex(r=>r.id===view.id),order=[...filtered.slice(n+1),...filtered.slice(0,n+1)],r=order.find(r=>r.requires_review&&state[view.stage][r.id]?.status!=='reviewed');if(r){view.id=r.id;refresh()}else message('当前筛选内的项目均已确认。')};
$('reviewer').value=state.reviewer||'';$('reviewer').oninput=()=>{state.reviewer=$('reviewer').value;persist()};$('ack').checked=state.acknowledged_review===true;$('ack').onchange=()=>{state.acknowledged_review=$('ack').checked;persist()};
function exportObject(complete=false){return {...clone(state),scope:P.assignment?'assignment':'full',schema_version:'1.0',stage:'adjudication',package_id:P.package_id,sample_sha256:P.sample_sha256,source_fingerprint:P.source_fingerprint,exported_at:new Date().toISOString(),complete,task12_topics_frozen:false}}
function download(data){const blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=P.package_id+'_adjudication_'+(P.assignment?P.assignment.id+'_':'')+(data.complete?'complete':'draft')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('exportDraft').onclick=()=>{download(exportObject());message('已导出裁决草稿。请确认下载文件已保存。')};$('exportComplete').onclick=()=>{const data=exportObject(true),errors=importErrors(data);if(errors.length){message(errors.slice(0,12).join('\n')+(errors.length>12?'\n另有 '+(errors.length-12)+' 项。':''),true);return}download(data);message(P.assignment?'本份完成文件已导出，请交回协调人合并确认。':'已导出本轮裁决完成文件，Task12 主题仍待全员确认。')};$('importFile').onchange=async()=>{try{const file=$('importFile').files[0];if(!file)return;const data=JSON.parse(await file.text()),errors=importErrors(data);if(errors.length)throw Error(errors.slice(0,8).join('\n'));state=data;persist();$('reviewer').value=state.reviewer||'';$('ack').checked=state.acknowledged_review===true;refresh();message('已导入裁决备份。')}catch(e){message('导入失败：'+e.message,true)}};
const percent=x=>x===null?'不定义':(x*100).toFixed(1)+'%',kfmt=x=>x===null?'不定义':x.toFixed(3);$('metrics').innerHTML='<table><thead><tr><th>判断</th><th class="number">一致率</th><th class="number">κ</th><th class="number">分母</th></tr></thead><tbody>'+['observed_language','aspect_presence','expression_status'].map(k=>{const m=P.metrics.cases[k];return '<tr><td>'+fields[k]+'</td><td class="number">'+percent(m.agreement)+'</td><td class="number">'+kfmt(m.cohen_kappa)+'</td><td class="number">'+m.n+'</td></tr>'}).join('')+Object.entries(P.metrics.cases.aspect_labels).map(([k,m])=>'<tr><td>'+esc(L.aspects[k])+'</td><td class="number">'+percent(m.agreement)+'</td><td class="number">'+kfmt(m.cohen_kappa)+'</td><td class="number">'+m.n+'</td></tr>').join('')+['group_kind','coherence_rating'].map(k=>{const m=P.metrics.groups[k];return '<tr><td>'+({'group_kind':'组性质','coherence_rating':'组评分'}[k])+'</td><td class="number">'+percent(m.agreement)+'</td><td class="number">'+kfmt(m.cohen_kappa)+'</td><td class="number">'+m.n+'</td></tr>'}).join('')+'</tbody></table>';$('limitations').innerHTML='<ul>'+P.limitations.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';setupAssignment();refresh();

 if(!P.assignment)return;

 $('workspace').after(reference);
 function renderReference(){const g=groupUniverse.find(x=>x.id===$('referenceGroupSelect').value);$('referenceGroupBody').innerHTML='<h2>'+esc(g.id)+' · 只读参考</h2><div class="compare"><section><h3>A · 原答</h3>'+answerHTML(g.A,'groups')+'</section><section><h3>B · 原答</h3>'+answerHTML(g.B,'groups')+'</section></div>'+g.examples.map(e=>'<details class="example"><summary>'+esc(e.id)+' '+tag(e.kind==='center'?'中心例子':'随机例子')+'</summary><div class="review-text">'+esc(e.text)+'</div></details>').join('')}
