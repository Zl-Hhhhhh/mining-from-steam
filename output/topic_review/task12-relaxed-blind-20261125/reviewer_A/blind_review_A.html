u0440\u0430\u0442\u044c. \u041d\u043e \u043f\u0443\u0442\u0438 \u043d\u0430\u0437\u0430\u0434 \u0443\u0436\u0435 \u043d\u0435\u0442, \u0434\u0443\u0448\u0430 \u043f\u0440\u043e\u0434\u0430\u043d\u0430 \u0434\u044c\u044f\u0432\u043e\u043b\u0443. \u0418 \u044f \u0445\u0437 \u043a\u0430\u043a \u043d\u043e\u0432\u0438\u0447\u043a\u0430\u043c \u0438\u0433\u0440\u0430\u0442\u044c \u0432 \u0434\u043e\u0442\u0443, \u043a\u0430\u043a\u043e\u0439-\u0442\u043e \u0441\u043c\u0443\u0440\u0444\u043f\u0443\u043b \u0441 \u043f\u0435\u0440\u0432\u043e\u0439 \u043a\u0430\u0442\u043a\u0438, \u0432\u043e\u0442 \u044d\u0442\u0438 \u0437\u0430\u0434\u0440\u044b \u043d\u0430 \u043c\u0438\u043f\u043e \u0441\u043e \u0441\u043a\u0440\u0438\u043f\u0442\u0430\u043c\u0438, \u0438\u043d\u0432\u043e\u043a\u0435\u0440\u044b, \u043d\u0443 \u0432\u044b \u043f\u043e\u043d\u0438\u043c\u0430\u0435\u0442\u0435. \u041d\u0435 \u0441\u0447\u0438\u0442\u0430\u044f \u0441\u043b\u043e\u0436\u043d\u0435\u0439\u0448\u0435\u0433\u043e \u0432\u0445\u043e\u0434\u043d\u043e\u0433\u043e \u043f\u043e\u0440\u043e\u0433\u0430 \u0432 \u0438\u0433\u0440\u0443, \u0432\u0430\u0441 \u0435\u0449\u0435 \u0438 \u0435\u0431\u0443\u0442 \u0436\u0435\u0441\u0442\u043a\u043e. \u042d\u0442\u043e \u0432\u0430\u043c \u043d\u0435 \u043c\u043b\u0431\u0431, \u0433\u0434\u0435 \u043c\u043e\u0436\u043d\u043e \u043d\u0430 \u0438\u0437\u0438\u0447\u0430\u0445 \u0431\u043e\u0442\u043e\u0432 \u0440\u0430\u0441\u043a\u0438\u0434\u044b\u0432\u0430\u0442\u044c \u0432\u043f\u043b\u043e\u0442\u044c \u0434\u043e \u0432\u044b\u0441\u043e\u0447\u0430\u0439\u0448\u0435\u0433\u043e \u0440\u0430\u043d\u0433\u0430. \u0412 \u043e\u0431\u0449\u0435\u043c, \u044d\u0442\u043e \u043a\u0430\u043a \u0431\u044b\u0442\u044c \u0432 \u0430\u0431\u044c\u044e\u0437\u0438\u0432\u043d\u044b\u0445 \u043e\u0442\u043d\u043e\u0448\u0435\u043d\u0438\u044f\u0445. \u0418\u043d\u043e\u0433\u0434\u0430 \u0434\u0430\u044e\u0442 \u043f\u0440\u0438\u044f\u0442\u043d\u043e \u043d\u0430 \u043a\u043d\u043e\u043f\u043e\u0447\u043a\u0438 \u043f\u043e\u043d\u0430\u0436\u0438\u043c\u0430\u0442\u044c, \u043d\u043e \u0432 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u043c \u044d\u043c\u043e\u0446\u0438\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0435 \u043a\u0430\u0447\u0435\u043b\u0438 (\u043f\u0440\u0438\u0432\u0435\u0442 \u041c\u0430\u0448\u0430 \u0438\u0437 10\u0411, \u0441\u0443\u043a\u0430). \u0415\u0441\u043b\u0438 \u0435\u0441\u0442\u044c \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u044c - \u043d\u0435 \u0438\u0433\u0440\u0430\u0439\u0442\u0435 \u0432 \u044d\u0442\u043e. \u0415\u0441\u043b\u0438 \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438 \u043d\u0435\u0442 - \u043f\u0440\u0438\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435\u0441\u044c \u043f\u0440\u0430\u0432\u0438\u043b\u0430 \u0411\u041e3, \u0447\u0442\u043e\u0431\u044b \u043d\u0435 \u0441\u043b\u0438\u0432\u0430\u0442\u044c \u0432\u0440 \u0432 \u0442\u0438\u043b\u044c\u0442\u0435. \u0422\u0438\u043f\u0430 \u0432\u043e\u0437\u044c\u043c\u0438\u0442\u0435 \u0437\u0430 \u043f\u0440\u0430\u0432\u0438\u043b\u043e \u0438\u0433\u0440\u0430\u0442\u044c \u043c\u0430\u043a\u0441\u0438\u043c\u0443\u043c \u0411\u041e3 \u0441\u0435\u0440\u0438\u044e \u0432 \u0434\u0435\u043d\u044c. \u0412\u044a\u0435\u0431\u0430\u043b\u0438 2 - \u0438\u0434\u0438\u0442\u0435 \u043e\u0442\u0434\u044b\u0445\u0430\u0442\u044c. \u0412\u044b\u0438\u0433\u0440\u0430\u043b\u0438 2 - \u0438\u0434\u0438\u0442\u0435 \u043e\u0442\u0434\u044b\u0445\u0430\u0442\u044c. \u0412\u044b\u0438\u0433\u0440\u0430\u043b\u0438 1 \u0438 \u0432\u044a\u0435\u0431\u0430\u043b\u0438 1 - \u043c\u043e\u0436\u0435\u0442\u0435 \u0441\u044b\u0433\u0440\u0430\u0442\u044c \u0442\u0440\u0435\u0442\u044c\u044e, \u043d\u043e \u043d\u0435 \u0431\u043e\u043b\u044c\u0448\u0435. \u0422\u0430\u043a \u0445\u043e\u0442\u044c \u043e\u0441\u0442\u0430\u043d\u0443\u0442\u0441\u044f \u043d\u0435\u0440\u0432\u043d\u044b\u0435 \u043a\u043b\u0435\u0442\u043a\u0438, \u043f\u043e\u0432\u0435\u0440\u044c\u0442\u0435 \u043c\u043d\u0435."}, {"id": "R047", "text": "I don't know if I can recommend.\n\nI have been playing Bot matches to get better at the game. \non easy diff, everything seems normal, to the point where it gets a little boring... makes sense.\non medium diff, like one of the commends below: if you like to get insta countered and not have the opportunity to counter, this game is for you.\n\npvp matches, seems fine, but you gotta know your stuff... \nbot matches, no matter how good you think you are, enemies will gank on you, be on your tail, insta fully charge heavies, and go to the final 2 just to die out of the blue and the enemy bot the win. not to mention that enemy weapons do not lose durability. \n\nthis game needs some serious balancing when it comes to bots."}, {"id": "R017", "text": "\u72d7\u5c4e\u6e38\u620f\uff0c\u6b7b\u4e86\u5988\u7684BVVD\u6253\u8fd9\u6e38\u620f\u4e0d\u662fM\u5c31\u662f\u559c\u6b22\u5403\u5c4e\uff0c\u4f9d\u65e7\u5b89\u4e1c\u661f\uff0c\u4f9d\u65e7\u672c\u6b21\u4e8b\u4ef6\u6b7b\u4e86\u4e09\u4e2a\u4eba\uff0c\u6211\u5c31\u4e00\u53e5\u8bddBVVD\u6211\u64cd\u4f60\u5988\r\n"}, {"id": "R098", "text": "- no ultrawide support\r\n- only XBOX controller button prompts when using a Dual Sense\r\n\r\nThis is one of the franchises where the developers do not give a lemon scented fuck about PC gaming."}, {"id": "R050", "text": "\u53ef\u4ee5"}, {"id": "R049", "text": "\u5b69\u5b50\u4eec\uff0c\u522b\u73a9\u7ebf\u4e0a\u5341\u4e2a\u91cc\u4e5d\u4e2a\u6302\uff0c\u8fd8\u6709\u4e00\u4e2a\u88ab\u6253\u7ea2\u6e29\u4e86\u5728\u627e\u6302"}, {"id": "R093", "text": "\u5783\u573e\u6e38\u620f\uff0c\u5361\u9a8c\u8bc1\u5361\u534a\u5929\uff0c\u4e00\u5806\u95ee\u9898"}, {"id": "R129", "text": "i hate everything about dbd with every fiber of my being throughout my existence on this dull disgusting planet i have found that dbd is the most manipulative evil brain eating stupid game to ever grace the earth\r\ndo not play this game"}, {"id": "R068", "text": "\u542c\u4ed6\u4eec\u8bf4\u597d\u73a9\u7684\u6e38\u620f\u90fd\u4e0d\u8bc4\u4ef7\uff0c\u5dee\u7684\u6e38\u620f\u624d\u4f1a\u7279\u610f\u5dee\u8bc4\u3002\u6240\u4ee5\u8d76\u7d27\u6765\u7ed9\u6211\u559c\u6b22\u7684\u6e38\u620f\u8bc4\u4ef7\u4e00\u4e0b\u3002\u770b\u5dee\u8bc4\u597d\u591a\u4eba\u8bf4\u96be\u5ea6\u9ad8\uff0c\u73b0\u5728\u6ca1\u4ec0\u4e48\u611f\u89c9\u4e86\u3002\u4f46\u60f3\u60f3\u7b2c\u4e00\u6b21\u73a9\u7684\u65f6\u5019\u7684\u786e\u633a\u96be\u7684\uff0c\u867d\u7136\u73b0\u5728\u5df2\u7ecf\u6bd4\u8f83\u5f97\u5fc3\u5e94\u624b\uff0c\u4f46\u7b2c\u4e00\u6b21\u73a9\u7684\u65f6\u5019\u7531\u4e8e\u5b8c\u5168\u4e0d\u4f1a\u73a9\uff0c\u6240\u4ee5\u653e\u5f03\u4e86\u3002\u76f4\u5230\u540e\u6765\u8ddf\u7740\u5b89\u5361\u7684\u653b\u7565\u8fc7\u4e86\u4e00\u904d\uff0c\u8fd8\u662f\u597d\u96be\uff0c\u54c8\u54c8\u54c8\u54c8\u3002\u4e0d\u8fc7\u73b0\u5728\u5df2\u7ecf\u975e\u5e38\u719f\u7ec3\uff0c\u5b8c\u5168\u4e0d\u5728\u8bdd\u4e0b\uff01\u7b2c\u4e00\u6b21\u73a9\uff0c\u63a8\u8350\u642d\u914d\u653b\u7565\u98df\u7528\u3002\u8fd9\u6837\u518d\u73a9\u4e1d\u4e4b\u6b4c\u4f1a\u611f\u89c9\u7b80\u5355\u597d\u591a"}, {"id": "R091", "text": "\u53ea\u73a9\u4e86100\u4e2a\u5c0f\u65f6\u611f\u89c9\u91cc\u9762\u4e1c\u897f\u592a\u591a\u4e86 \u535a\u5927\u7cbe\u6df1\u554a\uff01\u8fd9299\u5f88\u503c"}, {"id": "R078", "text": "\u6ca1\u4eba\u554a\uff0c\u53ea\u80fd\u5f00AI\u3002\u800c\u4e14lis\u7684\u5bfc\u5f39\u6280\u80fd\u548c\u8f7d\u5177\u7ecf\u5e38\u5361\u89c6\u89d2\uff0c\u5fc5\u987b\u91cd\u5f00\u4e00\u5c40\u624d\u884c\u3002\u4e0d\u8fc7\u53f2\u4f4e\u6253\u6253AI\u5c31\u633a\u8212\u9002\u4e86"}, {"id": "R040", "text": "Really"}, {"id": "R045", "text": "Warframe is one of those games I always find myself returning to. Thanks to regular updates, patches, and new content, there's always something new to explore. Even after reaching the endgame, you can easily take a long break and jump back in whenever you feel like it. Once you've understood the core mechanics, getting back into the game is surprisingly easy.\r\n\r\nOne of the most interesting features is the variety of mission maps. Since most maps are procedurally generated, their layouts change with every run, making even familiar missions feel slightly different each time. While the core mission types can become repetitive, Digital Extremes regularly introduces new game modes and mechanics to keep things fresh.\r\n\r\nAnother major highlight is the incredible variety of Warframes, weapons, and modifications. There are countless opportunities to experiment with different builds and develop your own playstyle. Once you reach the endgame, you'll eventually realize that almost any build can become viable with the right combination of mods and equipment. This freedom is a huge part of what makes Warframe so enjoyable to me.\r\n\r\nOverall, Warframe is an outstanding free-to-play game with an incredible amount of content and excellent replayability.\r\n\r\nRatings:\r\n\r\n\u2b50 Graphics: 5/5\r\nFor a game released in 2013, Warframe still looks absolutely impressive. The detailed environments, visual effects, and overall design can easily compete with many modern games, in my opinion.\r\n\r\n\u2b50 Complexity: 4/5\r\nWarframe can be quite overwhelming for newcomers. Many mechanics are barely explained, and the game doesn't provide much guidance early on. Fortunately, there are now countless guides and community resources that make learning the game much easier.\r\n\r\n\u2b50 Resource Usage: 5/5\r\nWarframe is one of the best-optimized games I've ever played. Despite its impressive visuals, resource consumption is relatively low, allowing even many lower-end systems to run the game at high graphics settings.\r\n\r\n\u2b50 Endgame: 3/5\r\nWarframe doesn't really have a traditional endgame like Destiny 2 or other RPGs. Instead, it mainly revolves around farming resources, optimizing equipment, and preparing for future updates. Experimenting with different builds remains enjoyable, but the gameplay loop can eventually become somewhat repetitive. That's why my rating is a little lower here."}, {"id": "R115", "text": "Hades is probably the first proper action game I've played. Honestly, I didn't think I'd like a \"repetitive\" game, but Hades *is* genuinely fun (and frustrating lol), and I found myself deeply enjoying the story and inter-personal character developments. Beautiful character and background designs and phenomenal voice acting as well, though I personally did wish for different accents since the characters are Greek and North African, and fat characters. \n\nThe gameplay is challenging, and  I will not lie, it was difficult to like as a complete newbie, but the frustration of losing is also very motivating and it never felt like the game was insurmountable. And, there is a god-mode for those who prefer to play for the story instead as well. I do want the House Contracter's pricing to be cheaper though; that shit is day(or night)time robbery T-T\n\n"}, {"id": "R149", "text": "i was gutted when I got this for my sister and I to play together as I found that, if we split up, you have no idea where the other person is - they don't appear on the map so you are forever asking each other \"where are you??\" Very disappointing."}, {"id": "R020", "text": "good!!!"}, {"id": "R044", "text": "from my experience, you will not be fairly matched. In the funny games--as I refer to them--you will either be on a team that completely dominates every fight, or the team that gets washed over by the tsunami. No in between.\r\n\r\nWhen it comes to the \"team\" of 3's--your squad mates have 1/20th your damage, and the enemies are consistently 3 man squads communicating and rolling over your squad easily.\r\n\r\nIn short, the match making system makes this game either a cheap dopamine hit, or a complete bore."}, {"id": "R073", "text": "\u9996\u5148\u8bf4\u8fd9\u4e2a\u6e38\u620f\u73a9\u6cd5\u7c97\u7cd9\u5c31\u4e0d\u63d0\u4e86\uff0c\u4e24\u5929\u524d\u6765\u91cd\u65b0\u73a9\uff0c\u770b\u5230\u670915\u7f8e\u91d1\u4e70\u76ae\u80a4\u6216\u8005\u51b2VIP\u5c31\u53ef\u4ee5\u8fdb\u4e00\u4e9b\u6709\u7ba1\u7406\u6ca1\u6709\u5916\u6302\u7684\u670d\u52a1\u5668\u3002\u5f53\u65f6\u5c31\u53eb\u4e866-7\u4e2a\u670b\u53cb\u4e00\u8d77\u662f\u6bcf\u4e2a\u4eba\u90fd\u591a\u51b2\u4e8615\u7f8e\u91d1\uff0c\u5f88\u591a\u4eba\u90fd\u662f\u73b0\u4e70\u7684\u6e38\u620f\u3002\u7136\u540e\u53bb\u4e00\u4e2a\u5b98\u670d\u73a9\uff0c\u56e0\u4e3a\u665a\u8fdb4\u5929\u670d\uff0c\u4e0d\u4ec5\u5404\u79cd\u88ab\u8650\uff0c\u8270\u96be\u5b88\u5bb6\uff0c\u56e0\u4e3a\u4e0d\u4f1a\u73a9\uff0c\u5e8a\u5f00\u4e86\u5171\u4eab\uff0c\u7a97\u5b50\u53c8\u662f\u6ca1\u6709\u6846\u5b50\uff0c\u53cd\u6b63\u5404\u79cd\u88ab\u64cd\uff0c\u521a\u521a\u597d\u8f6c\u4e00\u70b9\uff0c\u7136\u540e\u88ab\u8bf4\u5f00\u6302\u4e86\uff0c\u88ab\u5c017\u5929\u3002\u611f\u89c9\u6839\u672c\u90fd\u6ca1\u6709\u813e\u6c14\uff0c\u8001\u5916\u50bb\u903c\u8d77\u6765\u662f\u771f\u7684\u50bb\u903c\uff0c\u73a9\u8fd9\u79cd\u670d\u8981\u6df7\u4ed6\u4eecdiscord\u7684\uff0c\u5426\u5219\u5c31\u662f\u5404\u79cd\u73bb\u7483\u5fc3\u4f1a\u778e\u4e3e\u62a5\u3002\u6211\u4eec\u5206\u6790\u4f30\u8ba1\u662f\u56e0\u4e3a\u4e00\u4e2a\u9ed1\u5974\u8eab\u4e0a\u91c7\u96c6\u4e867000\u4e2a\u751f\u94c1\uff0c\u88ab\u4eba\u6740\u4e86\uff0c\u622a\u56fe\u6000\u7591\u6211\u4eec\u5237\u7269\u8d28\uff0c\u6211\u4eec\u56e2\u961f\u9664\u4e86\u6211\u73a9\u8fc7100\u591a\u5c0f\u65f6\uff0c\u5176\u5b83\u4eba\u5c3110\u51e0\u4e2a\u5c0f\u65f6\uff0c\u5916\u6302\u518d\u90a3\u5356\u90fd\u641e\u4e0d\u6e05\u5462\uff0c\u4e13\u95e8\u82b115\u7f8e\u91d1\u96be\u9053\u6765\u6d4b\u8bd5\u9632\u6302\uff1f\u771f\u7684\u662f\u4e2a\u50bb\u903c\u6e38\u620f\uff0c\u5404\u79cd\u53cd\u4eba\u7c7b\u7684\u73a9\u6cd5\u4e0d\u8bf4\uff0c\u5168\u9760\u9a97\u4eba\u3002\u94b1\u5c31\u5f53\u5582\u72d7\u4e86\u3002"}, {"id": "R079", "text": "\u95ea\u5c4f\uff0c\u6839\u672c\u73a9\u4e0d\u4e86"}, {"id": "R086", "text": "It's so fun"}, {"id": "R088", "text": "\u633a\u597d\u73a9\u7684\uff0c\u4f46\u662f\u6709\u4e2a\u6700\u5927\u7684\u95ee\u9898\uff0c\u591a\u4f59\u7684\u9970\u54c1\u5361\u4ed3\u5e93"}, {"id": "R001", "text": "Amazing level design, still challenging enough for gamers and easy enough for non-gamers. Great to play with your partner! Cute design, attention to detail is amazing. Visuals are stunning. Lovely game, love the minigames as well. 10/10"}, {"id": "R037", "text": "\u770b\u8bc4\u8bba\u533a\u597d\u50cf\u8fd9\u5236\u4f5c\u7ec4\u4eba\u54c1\u4e0d\u884c\uff0c\u80cc\u53db\u73a9\u5bb6\uff0c\u6211\u4e5f\u8ddf\u56e2\u4e00\u6b21"}, {"id": "R133", "text": "I love this game so much. Its such a good game. I love this game. I love this game. its a good game. Amazing gameplay. Good game."}, {"id": "R124", "text": "Great story, great immersion and great level of character customizability."}, {"id": "R035", "text": "The best couch co-op game I\u2019ve ever played! If you\u2019re in a relationship and your partner is willing to give this game a shot, absolutely go for it. Even if you\u2019re new to platformers, the gameplay is relatively easy to learn, unless you decide to take on the infamous Helltower achievement.\n\nYou won\u2019t regret playing this masterpiece. It Takes Two is truly a game that stands above the rest. Between its entertaining story, creative co-op gameplay, and captivating set pieces, it delivers an unforgettable experience that will leave a lasting impression long after the credits roll. This game is an adventure best shared with someone special."}, {"id": "R144", "text": "."}, {"id": "R110", "text": "\u60f3\u4e70\u8fd9\u4e2a\u6e38\u620f\u7684\u4eba\u5148\u6765\u770b\u770b\uff1a\u5783\u573e\u6e38\u620f\uff0c\u5783\u573e\u6e38\u620f\uff0c\u5783\u573e\u6e38\u620f\uff0c\u91cd\u8981\u7684\u4e8b\u60c5\u8bf4\u4e09\u904d\u3002\u514d\u8d39\u7248\u4e0d\u73a9\uff0c\u73a9\u6b63\u7248\u53d7\u9e1f\u7f6a\uff0c\u8be5\uff01\n\n\uff08\u73a9\u8fd9\u6e38\u620f\u5c31\u50cf\u597d\u597d\u7684\u98de\u673a\u676f\u4e0d\u7528\uff0c\u975e\u8981\u7ed9\u5f69\u793c\u5f53\u529b\u5de5\u3002\u7ed3\u679c\u5c31\u662f\u4f60\u4e00\u51fa\u95e8\uff0c\u59bb\u5b50\u5c31\u5230\u5904\u5077\u60c5\uff0c\u56de\u5230\u5bb6\u7684\u4f60\u53d1\u73b0\u7a7a\u65e0\u4e00\u4eba\uff0c\u4f46\u5f69\u793c\u7ed9\u90fd\u7ed9\u4e86\uff0c\u5e76\u4e14\u8d85\u8fc7\u4e24\u5c0f\u65f6\u4e86\uff1b\n\n\u5f53\u7136\u5982\u679c\u4f60\u662f\u6781\u54c1\u529b\u5de5\uff0c\u5e76\u4e14\u542c\u5979\u8bf4\u5b8c\u81ea\u5df1\u8fd8\u662f\u5b8c\u74a7\u4e4b\u8eab\u540e\uff0c\u4f60\u4e0d\u4ec5\u7ed9\u4e86\u5f69\u793c\u8fd8\u9001\u8f66\u9001\u623f\u9001\u80a1\u4efd\u3002\u8ba9\u8fd9\u4e2a\u201c\u5904\u5973\u201d\u4e50\u7684\u9732\u51fa\u4e86\u5085\u9996\u5c14\u540c\u6b3e\u7b11\u5bb9\u3002\u606d\u559c\u4f60\u8fd9\u662f\u597d\u4e8b\u554a\uff01\u63a5\u4e0b\u6765\u5c31\u662f\u6781\u54c1\u529b\u5de5\u5c55\u793a\u8d22\u529b\u7684\u65f6\u5019\u4e86\uff1a\u6162\u70ed\u3001\u5b89\u5168\u611f\u3001\u60c5\u7eea\u4ef7\u503c\u3001\u6478\u4e00\u4e0b8\u5343\uff0c\u4eb2\u4e00\u4e0b9\u5343\uff0c\u505a\u4e00\u6b211\u4e07\u3001\u751f\u5b69\u5b50\u221e\u3001\u548c\u7537\u95fa\u871c\u5065\u8eab\u3001\u5b69\u5b50\u548c\u4f60\u6ca1\u6709\u8840\u7f18\u5173\u7cfb\u4f60\u5c31\u4e00\u70b9\u9519\u6ca1\u6709\u5417\u3001\u5b69\u5b50\u662f\u8c01\u7684A,B,C,\u221e\u3001\u5230\u6b64\u8eab\u4e3a\u6781\u54c1\u529b\u5de5\u7684\u4f60\u7ec8\u4e8e\u96c6\u9f50\u4e86\u6240\u6709DLC\u3001\u574f\u6d88\u606f\u5c0f\u7ea2\u4e66\u91cc\u6709\u4e2a\u53eb\u96c6\u5e02\u7684\u4e1c\u897f\u8fd8\u5728\u6e90\u6e90\u4e0d\u65ad\u66f4\u65b0\u65b0DLC\uff1b\n\n\u59bb\u5b50\u8fd8\u662f\u4e0d\u80af\u9732\u51fa\u679c\u4f53\uff0c\u56e0\u4e3a\u5979\u53ea\u4f1a\u5728\u5077\u60c5\u65f6\u8131\u4e0b\u5e03\u6761\u3002\u5e78\u8fd0\u7684\u662f\u76d8\u53e4\u770b\u5230\u4e86\u65ad\u5b50\u7edd\u5b59\u94b1\u4eba\u4e24\u7a7a\u7684\u4f60\uff0c\u5fc3\u75db\u4e0d\u5df2\uff0c\u5411\u5979\u6ce8\u5c04\u4e86\u9ed1\u5149\u75c5\u6bd2\uff0c\u5927\u5e45\u5ea6\u5524\u8d77\u5979\u7684\u4eba\u6027\uff0c\u4f46\u5979\u4f53\u5185\u7684\u5c0f\u7ea2\u4e66\u75c5\u6bd2\u548c\u817e\u8baf\u75c5\u6bd2\u8fd8\u662f\u6b7b\u6b7b\u5360\u636e\u8eab\u4f53\u3002\u5979\u62e5\u62b1\u4e86\u4f60\uff0c\u4f60\u7528\u75b2\u60eb\u7684\u8138\u770b\u5411\u201c\u4f60\u7684\u201d\u59bb\u5b50\u6216\u8005\u8bf4\u662f\u9ed1\u5149\u75c5\u6bd2\uff0c\u611f\u6168\u5230\u75c5\u6bd2\u7adf\u7136\u6bd4\u4eba\u6709\u4eba\u6027\u3002\u4f46\u611f\u6168\u548c\u75b2\u60eb\u8f6c\u77ac\u5373\u901d\uff0c\u4f60\u7684\u7b11\u5bb9\u8d8a\u53d1\u75c5\u6001\uff0c\u5185\u5fc3\u6df1\u5904\u7684\u529b\u5de5\u672c\u8d28\u8ba9\u4f60\u5bf9\u8fd9\u4e2a\u62e5\u62b1\u4f60\u7684\u9ed1\u5149\u75c5\u6bd2\u672c\u80fd\u5730\u758f\u8fdc\u3002\u6b64\u523b\u4f60\u5df2\u514b\u670d\u91cd\u91cd\u56f0\u96be\uff0c\u4f60\u662f\u8f6c\u79fb\u652f\u4ed8\u7684\u5148\u884c\u8005\uff0c\u4f60\u662f\u5f53\u6743\u8005\u7ef4\u7a33\u7684\u5e0c\u671b\uff0c\u4f60\u662f\u4e0d\u53ef\u6216\u7f3a\u7684\u4f1f\u5927\u529b\u5de5\u3002\uff09                                                                                                                                                                           \n\n1.\u8fd9\u6e38\u620f\u5c45\u7136\u6ca1\u6709\u4e91\u5b58\u6863\uff1f\n  \u5b58\u6863\u8def\u5f84\uff1aConanSandbox\\Saved\u3002\u8fd9\u4e2aSaved\u6587\u4ef6\u5939\u5c31\u662f\u4f60\u6e38\u620f\u7684\u6240\u6709\u5b58\u6863\uff0c\u5220\u6e38\u620f\u524d\u8bb0\u5f97\u8981\u5907\u4efd\uff0c\u4e0d\u7136\u5c31\u767d\u73a9\u4e86\n2.\u5343\u4e07\u4e0d\u8981\u628a\u6240\u6709DLC\u4e70\u4e86\uff0c\u56e0\u4e3a\u4e70\u4e86\u8fd9\u4e9bDLC\u4e5f\u4f53\u9a8c\u4e0d\u4e86\u5b8c\u6574\u6e38\u620f\uff0cConanExilesEnhanced-Complete Edition\u8fd9\u4e2a\u5b8c\u6574\u7248\u662f\u5047\u5b8c\u6574\u7248\uff0c\u6e38\u620f\u91cc\u6709\u5185\u8d2d\u7684\uff0c\u91cc\u9762\u7684\u96c6\u5e02\u5c31\u662f\u628aDLC\u62c6\u6210\u5355\u4e2a\u5708\u94b1\uff0c\u5f53\u7136\u4e86\u8fd9\u79cd\u719f\u6089\u7684\u5473\u9053\u80af\u5b9a\u662f\u90a3\u81ed\u4e0d\u53ef\u95fb\u7684\u817e\u8baf\u6563\u53d1\u51fa\u6765\u7684\n3.\u6e38\u620f\u80fd\u5168\u679c\uff0c\u4f46\u6700\u597d\u4e0d\u8981\u4f9d\u9760\u5168\u679cmod\uff0cmod\u4e0d\u7a33\u5b9a\u3002\u63a8\u8350\u76f4\u63a5\u4fee\u6539\u6587\u4ef6Game.ini\u548cServerSettings.ini"}, {"id": "R060", "text": "\u653e\u5230\u73b0\u5728\uff0c\u4e5f\u662f\u4e0d\u8fc7\u65f6\u7684\u6e38\u620f\uff0c\u503c\u5f97\u4e00\u73a9\u3002"}, {"id": "R141", "text": "\u5c0f\u65f6\u5019\u770b\u7236\u4eb2\u90a3\u4e00\u8f88\u73a9\u597d\u60f3\u73a9\uff0c\u957f\u5927\u6709\u81ea\u5df1\u7684\u7535\u8111\u4e86\u5f00\u59cb\u73a9\u53c8\u6ca1\u5565\u611f\u89c9\u4e86\uff0c\u7ec8\u4e0d\u4f3c\u5c11\u5e74\u6e38"}, {"id": "R032", "text": "Game dev is a performative activist, getting rid of the game for Xbox players because \u201cMuh Israel\u201d but keeps the game on steam and windows. Also if israel money is bad, why is the game still on Israeli steam/eshop/PSN? i guess the dev is ok taking Russian/ money, who have murdered way more ukranians in their war than israel ever done in gaza? Or the fact the game is ok in Iran or CCP China? with mass human rights violations? i could go on with more country examples but you get my point\n\nI\u2019ll be donating the money I wasted on this Troonslop to charity, like feeding starving people in Ukraine. Aka Actual activism"}, {"id": "R008", "text": "\u786e\u5b9e\u662f\u4e00\u573a\u78e8\u96be\uff0c\u5f88\u75db\u82e6\uff0c\u6211\u53ea\u662f\u666e\u901a\u5730\u6253\u5b8c\u4e86\u7b2c\u4e03\u7ae0\uff0c\u6218\u7ee9\u662f9\u5c0f\u65f610\u5206\uff0c2785\u6b21\u6b7b\u4ea1\uff0c\u4e94\u5341\u591a\u9897\u8349\u8393\uff0c\u8fd9\u7edd\u5bf9\u4e0d\u662f\u4e00\u573a\u6109\u5feb\u7684\u4f53\u9a8c\uff0c\u6211\u518d\u4e5f\u4e0d\u4f1a\u518d\u6253\u5f00\u5b83\uff0c\u7b2c\u4e03\u7ae0\u7684\u8c22\u5e55\u52a8\u753b\u6211\u770b\u5f88\u611f\u52a8\uff0c\u4f46\u662f\u8fd9\u5bf9\u6211\u800c\u8a00\u66f4\u50cf\u662f\u4e00\u573a\u4f53\u9762\u7684\u544a\u522b\uff0c\u5f88\u96be\uff0c\u4e0d\u662f\u4e13\u95e8\u6765\u5403\u82e6\u7684\u4eba\uff0c\u4e0d\u8981\u73a9"}], "topics": [{"id": "T01", "label": "\u73a9\u6cd5\u4e0e\u673a\u5236", "definition": "\u6838\u5fc3\u5faa\u73af\u3001\u5173\u5361\u3001\u6218\u6597\u3001\u7b56\u7565\u3001\u63a2\u7d22\u3001\u6784\u7b51\u548c\u660e\u786e\u7684\u6e38\u620f\u884c\u4e3a\u3002"}, {"id": "T02", "label": "\u64cd\u4f5c\u3001\u96be\u5ea6\u4e0e\u5e73\u8861", "definition": "\u8f93\u5165\u54cd\u5e94\u3001\u624b\u611f\u3001\u6309\u952e\u3001\u5b66\u4e60\u95e8\u69db\u3001\u6559\u7a0b\u3001\u6218\u6597\u96be\u5ea6\u548c\u6570\u503c\u5e73\u8861\u3002"}, {"id": "T03", "label": "\u6027\u80fd\u3001\u7a33\u5b9a\u6027\u4e0e\u6545\u969c", "definition": "\u5e27\u7387\u3001\u5361\u987f\u3001\u5d29\u6e83\u3001\u65e0\u6cd5\u542f\u52a8\u3001\u65e0\u54cd\u5e94\u3001\u517c\u5bb9\u6027\u3001\u670d\u52a1\u5668\u6280\u672f\u6545\u969c\u548c BUG\u3002"}, {"id": "T04", "label": "\u5267\u60c5\u4e0e\u89d2\u8272", "definition": "\u6545\u4e8b\u3001\u53d9\u4e8b\u7ed3\u6784\u3001\u4eba\u7269\u5851\u9020\u3001\u5bf9\u767d\u548c\u5267\u60c5\u8868\u8fbe\u3002"}, {"id": "T05", "label": "\u753b\u9762\u3001\u7f8e\u672f\u3001\u97f3\u4e50\u4e0e\u97f3\u6548", "definition": "\u89c6\u89c9\u98ce\u683c\u3001\u7f8e\u672f\u8d28\u91cf\u3001\u52a8\u753b\u3001\u97f3\u4e50\u3001\u97f3\u6548\u548c\u6574\u4f53\u89c6\u542c\u8868\u73b0\u3002"}, {"id": "T06", "label": "\u8054\u673a\u3001\u5339\u914d\u3001\u4f5c\u5f0a\u4e0e\u793e\u533a", "definition": "\u5408\u4f5c\u3001\u5bf9\u6218\u3001\u5339\u914d\u3001\u516c\u5e73\u6027\u3001\u5916\u6302\u3001\u73a9\u5bb6\u4e92\u52a8\u548c\u793e\u533a\u4f53\u9a8c\u3002"}, {"id": "T07", "label": "\u4ef7\u683c\u3001\u4ed8\u8d39\u4e0e DLC \u6536\u8d39", "definition": "\u4ef7\u683c\u3001\u6027\u4ef7\u6bd4\u3001\u5185\u8d2d\u3001\u4ed8\u8d39\u516c\u5e73\u3001\u8d2d\u4e70\u6210\u672c\u548c DLC \u6536\u8d39\u3002"}, {"id": "T08", "label": "\u5185\u5bb9\u91cf\u3001\u91cd\u73a9\u3001MOD \u4e0e\u66f4\u65b0\u7ef4\u62a4", "definition": "\u5185\u5bb9\u6570\u91cf\u3001\u4efb\u52a1\u6216\u5730\u56fe\u89c4\u6a21\u3001\u91cd\u73a9\u4ef7\u503c\u3001\u6a21\u7ec4\u3001DLC \u5185\u5bb9\u548c\u66f4\u65b0\u652f\u6301\u3002"}, {"id": "A04", "label": "\u5176\u4ed6\u5177\u4f53\u65b9\u9762", "definition": "\u516b\u4e2a\u4e3b\u9898\u4ee5\u5916\u3001\u80fd\u4ece\u539f\u6587\u6307\u51fa\u7684\u5177\u4f53\u5173\u6ce8\u70b9\u3002"}]}</script>
<script>
"use strict";
const element = id => document.getElementById(id);
const pack = JSON.parse(element("payload").textContent);
const storageKey = [pack.package_id, pack.assignment, pack.sample_sha256].join(":");
const validLanguages = ["english", "schinese", "mixed", "other", "uncertain"];
const validJudgments = ["concrete", "A01", "no_aspect", "A03"];
const blank = () => ({ language: "", judgment: "", evidence: {}, note: "" });
let answers = {};
let position = 0;

function restoreAnswers(data) {
  if (data.package_id !== pack.package_id || data.assignment !== pack.assignment ||
      data.sample_sha256 !== pack.sample_sha256 || !data.answers || typeof data.answers !== "object") {
    throw new Error("答卷与当前标注份或样本版本不一致");
  }
  return Object.fromEntries(pack.cases.flatMap(({ id }) => {
    const row = data.answers[id];
    if (!row || typeof row !== "object") return [];
    const evidence = Object.fromEntries(pack.topics
      .filter(({ id: topic }) => typeof row.evidence?.[topic] === "string")
      .map(({ id: topic }) => [topic, row.evidence[topic]]));
    return [[id, {
      language: validLanguages.includes(row.language) ? row.language : "",
      judgment: validJudgments.includes(row.judgment) ? row.judgment : "",
      evidence, note: typeof row.note === "string" ? row.note : "",
    }]];
  }));
}

const fields = Object.fromEntries(pack.topics.map(topic => {
  const row = document.createElement("div");
  row.className = "topic";
  const option = document.createElement("label");
  const box = document.createElement("input");
  box.type = "checkbox";
  option.append(box, " " + topic.label);
  const definition = document.createElement("small");
  definition.textContent = topic.definition;
  const evidenceRow = document.createElement("label");
  evidenceRow.className = "field";
  const quote = document.createElement("textarea");
  quote.setAttribute("aria-label", topic.label + "的原文证据");
  quote.placeholder = "粘贴原文证据";
  evidenceRow.append(quote);
  row.append(option, definition, evidenceRow);
  element("topicFields").append(row);
  box.onchange = saveCurrent;
  quote.oninput = saveCurrent;
  return [topic.id, { box, quote, evidenceRow }];
}));

function issue(answer = blank()) {
  if (!answer.language || !answer.judgment) return "请选择原文语言和方面判断。";
  if (answer.judgment === "concrete" && !Object.keys(answer.evidence).length) return "请至少选一个具体主题。";
  return "";
}

function response(complete) {
  const { package_id, assignment, sample_sha256 } = pack;
  return { package_id, assignment, sample_sha256, complete, position, answers };
}

function persist() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(response(false)));
  } catch {
    element("message").textContent = "浏览器无法自动保存，请导出草稿 JSON。";
  }
}

function update() {
  const current = pack.cases[position];
  const answer = answers[current.id] ?? blank();
  const completed = pack.cases.filter(row => !issue(answers[row.id])).length;
  element("progress").value = completed;
  element("progress").max = pack.cases.length;
  element("reviewHeading").textContent = current.id + " · 第 " + (position + 1) + " 条 · 已完成 " + completed + "/" + pack.cases.length;
  element("topicFields").hidden = answer.judgment !== "concrete";
  const showEvidence = element("showEvidence").checked;
  for (const field of Object.values(fields)) field.evidenceRow.hidden = !showEvidence || !field.box.checked;
  element("validation").textContent = issue(answer) || "本条已完成。";
}

function saveCurrent() {
  const judgment = element("judgment").value;
  const evidence = judgment === "concrete"
    ? Object.fromEntries(Object.entries(fields).filter(([, controls]) => controls.box.checked)
      .map(([id, controls]) => [id, controls.quote.value.trim()]))
    : {};
  answers[pack.cases[position].id] = {
    language: element("language").value, judgment, evidence, note: element("note").value.trim(),
  };
  persist();
  update();
}

function render() {
  const review = pack.cases[position];
  const answer = answers[review.id] ?? blank();
  element("reviewText").textContent = review.text.trim() ? review.text : "（原评论为空）";
  element("caseSelect").value = String(position);
  element("language").value = answer.language;
  element("judgment").value = answer.judgment;
  element("note").value = answer.note;
  for (const [id, field] of Object.entries(fields)) {
    field.box.checked = id in answer.evidence;
    field.quote.value = answer.evidence[id] ?? "";
  }
  element("previous").disabled = position === 0;
  element("next").disabled = position === pack.cases.length - 1;
  element("advance").disabled = element("next").disabled;
  update();
}

function go(index) {
  saveCurrent();
  position = Math.max(0, Math.min(pack.cases.length - 1, index));
  render();
  persist();
  element("reviewHeading").focus();
}

function nextIncomplete() {
  const index = pack.cases.findIndex(row => issue(answers[row.id]));
  if (index >= 0) go(index);
  return index;
}

function download(complete) {
  saveCurrent();
  if (complete && nextIncomplete() >= 0) {
    element("message").textContent = "已定位到尚未填写完整的评论。";
    return;
  }
  const data = { ...response(complete), exported_at: new Date().toISOString() };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + "\n"], { type: "application/json" }));
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = [pack.package_id, pack.assignment, complete ? "complete" : "draft"].join("_") + ".json";
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  element("message").textContent = complete ? "已导出完成答卷。" : "已导出草稿备份。";
}

element("assignment").textContent = pack.assignment;
pack.cases.forEach(({ id }, index) => {
  const option = document.createElement("option");
  option.value = String(index);
  option.textContent = id;
  element("caseSelect").append(option);
});
element("previous").onclick = () => go(position - 1);
element("next").onclick = element("advance").onclick = () => go(position + 1);
element("caseSelect").onchange = event => go(Number(event.target.value));
element("nextIncomplete").onclick = () => {
  if (nextIncomplete() < 0) element("message").textContent = "全部评论已完成。";
};
element("language").onchange = element("judgment").onchange = element("note").oninput = saveCurrent;
element("showEvidence").onchange = update;
element("saveDraft").onclick = () => download(false);
element("saveComplete").onclick = () => download(true);
element("restore").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    answers = restoreAnswers(data);
    position = Number.isInteger(data.position) && data.position >= 0 && data.position < pack.cases.length ? data.position : 0;
    render();
    persist();
    element("message").textContent = "已恢复导入的答卷。";
  } catch (error) {
    element("message").textContent = "导入失败 · " + error.message;
  }
  event.target.value = "";
};
try {
  const local = localStorage.getItem(storageKey);
  if (local) {
    const data = JSON.parse(local);
    answers = restoreAnswers(data);
    if (Number.isInteger(data.position) && data.position >= 0 && data.position < pack.cases.length) position = data.position;
  }
} catch {
  element("message").textContent = "未恢复本地答卷，可导入此前导出的草稿。";
}
render();
</script>
</html>
