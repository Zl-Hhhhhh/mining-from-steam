  <h1>Steam 评论主题盲审 <span id="assignment"></span></h1>
  <p class="muted">独立阅读整条评论，判断原文语言和有无具体方面。有具体方面时可多选主题。</p>
  <details>
    <summary>标注口径</summary>
    <p>一条评论可有多个主题。纯好评或差评选「泛评价」。纯符号、与游戏无关或空白可选「无具体方面」。语境、语言或含义无法判断时，选「不确定」。</p>
    <p>技术掉线或卡顿归性能，合作或匹配体验归联机。DLC 内容量归内容，收费归价格。勾选模板只使用已选项和作者自己的正文。原文证据和备注均可选填。</p>
  </details>

\u4e5f\u597d\u554a\u3002\u4f60\u6709\u8fd9\u4e48\u591a\u79cd\u9009\u62e9\u65b9\u5f0f\uff0c\u6211CNMD\u8001\u6eda\u9009\u62e9\u4e86\u4e71\u5e8f\u3002\u6211\u6c38\u8fdc\u641e\u4e0d\u6e05\u6211\u7684\u88c5\u5907\u5230\u5e95\u5728\u54ea\u91cc\uff0c\u6cd5\u6756\u91cc\u9762\u6df7\u5408\u7740\u8fd1\u6218\u53c8\u6df7\u7740\u51e0\u5f20\u5f13\uff0c\u66f4\u522b\u63d0\u4f60\u8fd9sm\u6e38\u620f\u538b\u6839\u6ca1\u8bbe\u8ba1\u88c5\u5907\u680f\uff0c\u4f60\u8131\u6362\u88c5\u5907\u8fd8\u8981\u53bb\u80cc\u5305\u91cc\u9762\u4e00\u4e2a\u4e2a\u627e\u3002\u90a3\u4e2a\u504f\u7231\u8bbe\u7f6e\u7b80\u76f4\u8111\u762b\uff0c\u4f60\u624b\u67c4\u914d\u7f6e\u5341\u5b57\u952e\u505a\u4e00\u4e2a\u4e0a\u662f\u8fd1\u6218\uff0c\u4e0b\u662f\u8fdc\u7a0b\uff0c\u5de6\u662f\u9b54\u6cd5\uff0c\u53f3\u662f\u836f\u6c34\u5f88\u96be\u5417\uff1fnmlg\u7684\u5168\u52fe\u5df4\u5806\u5728\u4e00\u8d77\uff0c\u641e\u8fd9\u4e48\u957f\u4e00\u5217\uff0c\u4f60\u4e0d\u89c9\u5f97\u53cd\u4eba\u7c7b\u5417\uff1f\u90a3\u6211\u95ee\u4f60\uff0c\u4f60\u7a7a\u7684\u53e6\u5916\u6309\u952e\u662f\u5e72\u561b\u7684\uff1f\u7559\u7740\u7ed9\u4f60\u5988\u575f\u5934\u79cd\u82b1\u5417\uff1f\u8fd8\u6709\u90a3\u4e2a\u9001\u4fe1\u7684\uff0c\u4f60\u5988\u903c\u7684\u4e0d\u80fd\u505a\u4e2a\u5f53\u573a\u9605\u8bfb\u5417\uff1f\u7ed9\u4f60\u76f4\u63a5\u585e\u8fdb\u80cc\u5305\uff0c\u4e5f\u4e0d\u8ddf\u4f60\u8bf4\u9053\u5177\u540d\u5b57\uff0c\u7136\u540e\u8ba9\u4f60\u5728\u80cc\u5305\u4f60\u6361\u7684\u4e00\u5806\u5783\u573e\u4e66\u91cc\u9762\u6309\u7167\u4e71\u5e8f\u6765\u627e\u5230\u90a3\u5c01\u672a\u8bfb\u7684\u4fe1\uff0c\u6211\u771f\u662fcnm\u4e86\u3002\n2\u3001sm\u6e38\u620f\u6d41\u7a0b\uff1a\u9996\u5148\u4f60\u52fe\u5df4\u4e3b\u7ebf\u652f\u7ebf\u80fd\u4e0d\u80fd\u5206\u4e24\u4e2a\u680f\u5462\uff0c\u522b\u6709\u7684\u5728\u5176\u4ed6\uff0c\u6709\u7684\u53c8\u5728\u4efb\u52a1\u603b\u89c8\u91cc\u9762\uff1f\u800c\u4e14\u4f60\u52fe\u5df4\u63a5\u7684\u652f\u7ebf\u80fd\u4e0d\u80fd\u6709\u70b9\u5408\u7406\u5ea6\uff1f\u663e\u6446\u81ea\u5df1\u6709\u5927\u5730\u56fe\uff1a\u201d\u54c7\u6492\u6211\u4eec\u7684\u6e38\u620f\u592a\u81ea\u7531\u4e86\uff0c\u4f60\u5f00\u5c40\u60f3\u53bb\u54ea\u91cc\u5c31\u53bb\u54ea\u91cc\u201c\u3002\u90a3\u4f60\u80fd\u4e0d\u80fd\u522b\u4ed6\u5988\u641e\u6210\u6211\u5728\u5730\u56fe\u5de6\u4e0b\u89d2\u63a5\u4e2a\u4efb\u52a1\uff0c\u544a\u8bc9\u6211\u4efb\u52a1\u70b9\u5728\u5730\u56fe\u53f3\u4e0a\u89d2\u8fd9\u79cd\u4e8b\uff1f\u4f60\u81ea\u5df1\u5728\u767d\u6f2b\u63a5\u63a5\u652f\u7ebf\u770b\u770b\uff0c\u4f60\u770b\u770b\u4f60\u8fd9\u4e9b sm\u4efb\u52a1\u90fd\u5728\u5730\u56fe\u7684\u54ea\u4e9b\u5730\u65b9\uff1f\u4f60\u4e00\u65b9\u9762\u53c8\u6709\u5730\u533a\u7b49\u7ea7\u548c\u96be\u5ea6\u7684\u8bbe\u7f6e\uff0c\u4e00\u65b9\u9762\u53c8\u641e\u8fd9\u79cd\u6ee1\u5929\u661f\u5f0f\u7684\u652f\u7ebf\uff0c\u662f\u4e0d\u662f\u6709\u70b9\u8fc7\u4e8e\u9006\u5929\u4e86\uff1f\u4f60\u4eec\u81ea\u5df1\u505a\u5b8c\u6e38\u620f\u81ea\u5df1\u4e0d\u73a9\u7684\uff1f\u4f60\u4eec\u7684\u6e38\u620f\u89c4\u5212\u505a\u5230\u968f\u8fdb\u5ea6\u53d1\u653e\u4efb\u52a1\u5bf9\u4f60\u4eec\u6765\u8bf4\u5f88\u96be\u5417\uff1f\n3\u3001cjb\u66f4\u65b0\uff1a\u4f60\u4e0d\u4f1a\u771f\u89c9\u5f97\u4f60\u6e38\u620f\u53e3\u7891\u9500\u91cf\u53cc\u4e30\u6536\uff0c\u5168\u662f\u81ea\u5df1\u505a\u7684\u597d\u5427\uff1f\u4f60B\u793e\u80fd\u6709\u73b0\u5728\u7684\u5149\u666f\uff0c\u90a3\u4e48\u591aMOD\u4f5c\u8005\u7ed9\u4f60\u4eec\u8d21\u732e\u4e86\u591a\u5c11\u5fc3\u8840\uff1f\u6240\u4ee5\u6211\u7684\u610f\u601d\uff0c\u5982\u679c\u4f60\u4eec\u4e0d\u662f\u5b8c\u5168\u50bb\u903c\u7684\u8bdd\u5e94\u8be5\u4e5f\u77e5\u9053mod\u5bf9\u4f60\u4eec\u6e38\u620f\u7684\u91cd\u8981\u6027\u3002\u90a3\u65e2\u7136\u5982\u6b64\uff0cwcnmd\u4f60\u4eec\u8fd9\u5e2e\u50bb\u903c\u4ed6\u5988\u76842026\u5e74\u8fd8\u5728\u8fd9\u52fe\u5df4\u66f4\u65b0\u4ec0\u4e48\u4e1c\u897f\u5462\uff1f\u4f60\u4eec\u8fd9\u5e2e\u53f8\u9a6c\u73a9\u610f\u771f\u80fd\u66f4\u65b0\u51fa\u4e2a\u4e09\u4e03\u4e8c\u5341\u4e00\u6211\u4e5f\u5c31\u4e0d\u8bf4\u8bdd\u4e86\uff0ccnmd\u7684\u9694\u4e09\u5c94\u4e94\u641e\u4e2a\u5c0f\u8865\u4e01\u628amod\u5168\u6574\u5931\u6548\uff0c\u7136\u540e\u6211\u767b\u6e38\u620f\u4e00\u770b\uff1a\u4f60BUG\u4e5f\u6ca1\u4fee\u554a\uff1f\u90a3\u6211\u95ee\u4f60\uff0c\u4f60\u4eec\u8fd9\u5e2e\u53f8\u9a6c\u73a9\u610f\u5230\u5e95\u5728\u8fd9\u91cc\u66f4\u65b0\u4ec0\u4e48\u4e1c\u897f\uff1f\u4e0d\u6076\u5fc3\u4eba\u4f60\u4eec\u662f\u96be\u53d7\u662f\u5417\uff1f\n\u9664\u4e86\u8fd9\u4e09\u70b9\u662f\u8fd9\u6b3e\u8d85\u8d8a\u65f6\u4ee3\u7684\u6e38\u620f\u4e0a\u7684\u8d85\u8d8a\u65f6\u4ee3\u7684\u95ee\u9898\uff0c\u4f60\u5728\u771f\u6b63\u6e38\u73a9\u8fc7\u7a0b\u4e2d\u7684\u5c0f\u95ee\u9898\u8fd8\u6709\u5f88\u591a\u2014\u2014\u50cf\u662f\u4ec0\u4e48\u75be\u8dd1\u7684\u65f6\u5019\u4e0d\u80fd\u8df3\uff08\u6211\u4e0d\u77e5\u9053\u4e3a\u4ec0\u4e48\u8fd9\u79cd\u5730\u65b9\u4e0d\u53bb\u505a\uff09\uff1b\u5077\u7a83\u548c\u72af\u7f6a\u7cfb\u7edf\u8fc7\u4e8e\u9006\u5929\uff08\u4f60\u6c38\u8fdc\u4e0d\u77e5\u9053\u4e3a\u4ec0\u4e48\u6ca1\u4eba\u770b\u89c1\u4e5f\u7b97\u72af\u7f6a\u4ee5\u53ca\u7f6a\u884c\u4e0d\u88ab\u902e\u4f4f\u6c38\u8fdc\u4e0d\u6e05\u96f6\u8fd9\u79cd\u9006\u5929\u8bbe\u5b9a\uff09\uff1b\u4e0d\u660e\u6240\u4ee5\u7684\u968f\u4ece\u7cfb\u7edf\uff08\u4f60\u751a\u81f3\u4e0d\u80fd\u50cf\u53e4\u65e9RPG\u4e00\u6837\u968f\u610f\u66f4\u6362\u4ed6\u4eec\u7684\u88c5\u5907\u5916\u89c2\uff0c\u4ee5\u53ca\u5c0f\u4e11AI\uff09\u7b49\u7b49\u7b49\u7b49\u3002\u6240\u4ee5\u6211\u8fd8\u662f\u90a3\u53e5\u8bdd\uff0c\u8001\u6eda\u4e94\u9002\u5408\u5f53\u5e74\u90a3\u6279\u4eba\u7528\u4e8e\u7f05\u6000\u81ea\u5df1\u7684\u9752\u6625\uff0c\u6000\u5ff5\u66fe\u7ecf\u7684\u9752\u8471\u5c81\u6708\uff0c\u4e0d\u9002\u5408\u73b0\u5728\u4ee5\u53ca\u4ee5\u540e\u7684\u65b0\u4eba\u6e38\u73a9\u3002"}, {"id": "R118", "text": "\u041a\u0442\u043e\u0439 \u0438\u0433\u0440\u0443\u043b\u044f\n"}, {"id": "R070", "text": "\u6211\u8bf4\u5b9e\u8bdd\uff0c\u751f\u6d3b\u592a\u5982\u610f\u5c31\u6765\u73a9\u8fd9\u4e2a\uff0c\u6211\u5c31\u60f3\u95ee\uff08\u5267\u900f\u8b66\u544a\uff09\u4f60\u53ef\u4ee5\u62c5\u5fc3\u6211\uff0c\u4f60\u53ef\u4ee5\u8bf4\u6211\u722c\u8fd9\u4e2a\u697c\u4e5d\u6b7b\u4e00\u751f\uff0c\u4f46\u662f\u6211\u722c\u4e0a\u53bb\u4e86\u5e76\u4e14\u4fee\u597d\u4e86\uff0c\u4f60tm\u5565\u90fd\u4e0d\u7ba1\u9b3c\u4e00\u6837\u4e5f\u722c\u4e0a\u6765\uff0c\u4e0a\u6765\u7ed9\u6211\u4e00\u5df4\u638c\u7136\u540e\u8bf4\u4f60\u722c\u4e0a\u6765\u7ed9\u978b\u722c\u574f\u4e86\u8bf4\u8ba9\u6211\u7ed9\u4f60\u4e70\u978b\uff0c\u5367\u69fd\u5144\u5f1f\uff0c\u8fd9\u5267\u60c5\u8c01\u770b\u8c01\u4e0d\u8111\u6ea2\u8840\u554a\uff0c\u7b2c\u4e00\u6b21\u89c1\u9762\u8fd9\u50b2\u5a07\u8c01\u554a\uff0c\u4e13\u95e8\u8bbe\u8ba1\u4e00\u4e2anpc\u6765ex\u4eba\u6211\u7406\u89e3\uff0c\u73a9\u5230\u540e\u9762\u6211\u52d2\u4e2a\u5929\u7237\uff0c\u4f60\u662f\u5973\u4e3b\u554a"}, {"id": "R130", "text": "10/10"}, {"id": "R087", "text": "Lots of fun and I've only just started. I found the online guides helpful. It's a relaxing game that doesn't need to be rushed. There are strategies that are important; but you can go at your own pace."}, {"id": "R036", "text": "1"}, {"id": "R113", "text": "\u73a9\u4e0d\u4e86\u4e00\u70b9\uff0c\u4f60\u5012\u662f\u8ba9\u6211\u8fdb\u53bb\u554a\uff0c\u9632\u5916\u6302\u7ed9\u6211\u9632\u4e0a\u4e86"}, {"id": "R039", "text": "I Loved this game , when  I play the game. I become in love in this game. Its the an game by valve and even after 21 years, It still impressive that its really good lore, gameplay , characters and its fan made games like kayf life 2 or entropy zero and 2 . I havent played the original game half life and cant play half life alyx cause I dont got an vr set ( I dont Wana do the noVr mod ) but I will buy it in sales and chrismas and without it. My first and favorite game gmod would not exist. I recommend to play other games by valve like Tf2 or portal cause they have great lore and gameplay too ( also counter strike and its game too ) so Thank You half life 2 for making my life:D"}, {"id": "R151", "text": "\u6709\u4eba\u4e00\u8d77\u5417"}, {"id": "R022", "text": "I don't usually comment on anything, but removing cutscenes from a game I paid money for a few months ago? Really? I only liked the game because of Spike's prologue, and there was already a skip button for the ones who didn't want to play this part. I touched the game again after months, and the most great gameplay cutscenes were gone not just Spike's prologue, but also other gameplay cutscenes. I know the game was already a mess, but now it is just unplayable to tolerate. The game is enough to play only if you don't care the core story. They also removed the tutorial for new players. Techland has ruined my trust and love for Dying Light. Just play Dying Light 1 instead but I cannot recommend this game to anyone anymore \ud83d\udc4e\ud83c\udffb"}, {"id": "R126", "text": "\u043e\u0447\u0435\u043d\u044c \u0432\u0435\u0441\u0435\u043b\u043e \u0435\u0441\u0442\u044c \u0441\u0442\u0440\u0430\u0448\u043d\u044b\u0435 \u043c\u043e\u043c\u0435\u043d\u0442\u044b \u043c\u043e\u0436\u043d\u043e \u043f\u0440\u0438\u0443\u0447\u0430\u0442\u044c \u0434\u0438\u043d\u043e\u0437\u0430\u0432\u0440\u043e\u0432 \u0438 \u0442.\u0434 \u0441\u0442\u043e\u0438\u0442 \u043d\u0435 \u0434\u043e\u0440\u043e\u0433\u043e"}, {"id": "R019", "text": "???"}, {"id": "R132", "text": " I like this game because it is fast paced, and has different characters to play based on playstyle."}, {"id": "R096", "text": "An agonizingly suffocating, sluggish and slow game. I have played many turn-based games, but they usually at least have some kind of pacing. Here, every dungeon has to be cleared multiple times - yes, they added a roguelike concept - because your heroes get scared, fall into depression, die and so on.\n\nBut the point is that roguelikes are usually dynamic and there is no problem killing or running past the same enemy, since in games like Dead Cells or Rogue Legacy you can run through an entire level in literally a couple of minutes. Here, a single battle can easily take 3-5 minutes due to SLOOOW actions and SLOOOOOOOOW animations for every single action.\n\nI tried, I honestly tried. But no. It is like playing marathon battles in War Thunder over and over again - after playing, you are left with only a feeling of exhaustion, weariness and disappointment. And that is not even mentioning the town upgrade grind, resource gathering for building construction and so on.\n\nI would rather replay BG3 yet again and look at that octopus once more than launch this one more time (x_x)"}, {"id": "R084", "text": "Too much DLC, puts me off the game completely."}, {"id": "R154", "text": "\u4e0d\u60f3\u5439\u6bdb\u6c42\u75b5\uff0c21\u5e74\u524d\u7684\u6e38\u620f\u5728\u5173\u5361\u89e3\u5bc6\u3001\u5730\u56fe\u8bbe\u8ba1\u548c\u7269\u7406\u5f15\u64ce\u505a\u7684\u76f8\u5f53\u6210\u719f\uff0c\u5b8c\u5168\u4e0d\u8f93\u73b0\u5728\u7684\u6e38\u620f\u3002\u4f46\u4ee5\u73b0\u4ee3\u773c\u5149\u6765\u770b\u786e\u5b9e\u5b58\u5728\u4e0d\u5c11\u7f3a\u70b9\uff0c\u753b\u8d28\u96be\u514d\u8f83\u5dee\u3001\u8001\u6e38\u620f\u90e8\u5206\u673a\u5236\u843d\u540e\u3001\u624b\u611f\u8fc7\u5206\u8f7b\u98d8\u4ee5\u53ca\u5b58\u5728\u5f88\u591aBUG\u3002\n\n\u6218\u6597\u65b9\u9762\uff0c\u5bf9\u654c\u624b\u6bb5\u76f8\u5f53\u4e30\u5bcc\uff0c\u6709\u5404\u79cd\u6b66\u5668\u548c\u4ea4\u4e92\u7528\u6765\u5bf9\u7b56\u5404\u79cd\u7c7b\u578b\u654c\u4eba\u3002\u4e00\u4e9b\u7ae0\u8282\u8fd8\u53ef\u4ee5\u7528\u8f7d\u5177\u3001\u56fa\u5b9a\u673a\u67aa\u548c\u6307\u6325\u5b9d\u53ef\u68a6\u8681\u72ee\u5e94\u654c\u3002\n\n\u5267\u60c5\u65b9\u9762\uff0c\u4e16\u754c\u89c2\u5f88\u5e9e\u5927\uff0c\u4f46\u5bf9\u6ca1\u73a9\u8fc7\u524d\u4f5c\u7684\u4e0d\u592a\u53cb\u597d\uff0c\u4e0d\u770b\u89e3\u6790\u5b8c\u5168\u7406\u4e0d\u6e05\u5404\u65b9\u52bf\u529b\u548c\u4e3b\u8981\u89d2\u8272\u9519\u7efc\u590d\u6742\u7684\u5173\u7cfb\uff0c\u4e3b\u7ebf\u91cc\u5f88\u591a\u524d\u60c5\u548c\u8bbe\u5b9a\u662f\u771f\u4e00\u70b9\u4e0d\u7ed9\u4ea4\u4ee3\u3002\u5168\u6d41\u7a0b\u4e0b\u6765\u65e0\u8bba\u8d70\u5230\u54ea\u90fd\u88ab\u53cb\u519b\u5f53\u6210\u6551\u4e16\u4e3b\uff0c\u6709\u79cd\u201c\u5929\u4e0b\u8c01\u4eba\u4e0d\u8bc6\u541b\u201d\u7684\u611f\u89c9\uff0c\u4ee3\u5165\u611f\u548c\u60c5\u7eea\u4ef7\u503c\u7ed9\u5f97\u76f8\u5f53\u8db3\u3002\n\n\u867d\u8bf4\u8001\u6e38\u620f\u8e69\u811a\u7684\u7684\u5730\u65b9\u4e0d\u5c11\uff0c\u4f46\u672c\u4f53\u548c\u4e24\u4e2aDLC\u5168\u6d41\u7a0b\u4e0b\u6765\u8fd8\u662f\u6709\u4e9b\u610f\u72b9\u672a\u5c3d\uff0c\u6709\u751f\u4e4b\u5e74\u671f\u5f85\u80fd\u67093\u4ee3\u6216\u8005\u534a\u6761\u547dAlyx\u90a3\u6837\u7684\u91cd\u5236\u7248\u5427\u3002"}, {"id": "R089", "text": "\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\n\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u28bf\u28ff\u28cd\u28c9\u28c9\u28c9\u281b\u281b\u283f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\n\u28ff\u28ff\u28ff\u28ff\u28ff\u28bf\u28ff\u287f\u28ff\u28ff\u28bf\u28ff\u287f\u28ff\u28ff\u28bf\u28ff\u287f\u28ff\u28ff\u28bf\u28ff\u287f\u28ff\u28ff\u28bf\u28ff\u28df\u281f\u2889\u28f4\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u28f6\u28f6\u28ec\u28ed\u28ff\u28ff\u281b\u28ff\u28ff\u28ff\u28bf\u28ff\u287f\u28ff\u28ff\u28bf\u28ff\u287f\u28ff\u28ff\u28bf\u28ff\u28ff\n\u28ff\u28ff\u28ff\u28ff\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u281f\u288b\u28f4\u28ff\u28ff\u28ff\u28ff\u287f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff ae\u28f3\u28bd\u2895\u28d7\u28af\u28eb\u28af\u286b\u28d7\u2897\u287d\u28fa\u287a\u2840\u2808\u2804\u2802\u2810\u2804\u2880\u2802\u2827\u28af\u28ba\u2895\u286d\u28ea\u284b\u28aa\u28f6\u287e\u28df\u28f7\u28bf\u28fd"}, {"id": "R055", "text": "\u6e38\u620f\u521a\u53d1\u552e\uff0c\u5c31\u662f\u5783\u573e\u3002\u73b0\u572820\u591a\u5757\u94b1\u6253\u4eba\u673a\uff0c\u5c31\u662f\u795e\u4f5c\u3002"}, {"id": "R114", "text": "\u592a\u809d\u4e86"}, {"id": "R092", "text": "\u4e22\uff0c\u4e2d\u56fd\u73a9\u5bb6\u5c31\u8fd9\u4e48\u559c\u6b22\u8ddf\u98ce\uff1f\u8bc4\u5206\u9a97\u6211\u5165\u5751\uff0c \u8fd9\u6e38\u620f\u662f\u771f\u7684\u4e0d\u597d\u73a9\uff0c\u5b83\u96be\u73a9\u6211\u4e0d\u4f1a\u56e0\u597d\u8bc4\u4eba\u6570\u8fc7\u591a\u6211\u5c31\u4e0d\u7ed9\u5dee\u8bc4\u3002\n\n\u8fd9\u6e38\u620f\u5c31\u662f\u8868\u9762\u7ed9\u4f60\u4e00\u79cd\u5185\u5bb9\u4e30\u5bcc\uff0c\u9898\u6750\u8d85\u5e38\uff0c\u5b9e\u9645\u5185\u5bb9\u7a7a\u6d1e\u73a9\u6cd5\u8d85\u5355\u4e00\u4e14\u91cd\u590d\u3002\n\n\u8fd9\u6b3e\u6e38\u620f\u5728\u5168\u4e16\u754c\u53ea\u6709\u5b83\u8fd9\u4e00\u6b3e\u6e38\u620f\u7684\u60c5\u51b5\u4e0b\u5b83\u786e\u5b9e\u662f\u795e\u4f5c\u3002\n\u4f46\u8fd9\u6e38\u620f\u5728\u540c\u7c7b\u578b\u592a\u7a7a\u79d1\u5e7b\u9898\u6750\u3001\u751f\u5b58\u3001\u5efa\u9020\u9898\u6750\u3001\u5f00\u653e\u63a2\u7d22\u4e16\u754c\u7c7b\u578b\u7684\u6df1\u5ea6\u4e0a\u51e0\u4e4e\u5c31\u662f\u5783\u573e"}, {"id": "R116", "text": "Love this game. This is my favorite tactical shooter to play single player, and has no doubt revolutionized the tactical shooter genre in many ways, but the friendly AI needs some sorely needed updates. The amount of times I'll tell my team to do something for them to bug out and not do it is crazy. The friendly AI also seems to be part time pacifists, sometimes holding their lethal gun fire on suspects when they are being shot at, and abstaining completely from shooting noncompliant armed suspects trying to evade orders when my team have non lethal weapons like my beloved beanbag shotgun. Besides this, none of your team mates can throw a grenade into a room to save their lives, consistently throwing them right on the threshold or the side of the door where the cops are.\n\nThe enemy AI, Especially on hard, love to hold wicked angles on you and your team to where they are pretty much impossible to hit with a pump action beanbag shotgun (Especially when they are behind a window, metal bars or pipes. This is especially infuriating on valley of the dolls, where your team loves to go up and lick the windows so all of the suspects on the ground floor can see and then shoot them). I've learned to abuse the heck out of the alt button to hold my own wicked (and probably physically not accomplishable due to spines, bones and what not) angles on suspects. \n\nAnother gripe, there's been several instances where I have dumped the entire beanbag shotgun's magazine onto armed suspects and they still refuse to surrender. I can maybe understand on maps with junkies like twisted nerve, as the subject is probably high on some illicit substance and can (At least temporarily) disregard the fact that their ribs and internals have been bean bagged to the point of being a homogenized sludge and even after being shot right in the go-nads just for  good measure. Sure, whatever. But when I'm going up against professional security or any other group, it seems pretty unlikely that they get right back up and continue to shoot at me after dumping a whole mags worth of beanbags into them. Easily some of the worst times I've had in this game is when this kind of thing occurs, no matter how many times you bean bag them, grenade them or melee them, they refuse to surrender. It ruins the whole mission and sometimes the whole run, and makes me want to play this game less. Also, is it just me or do suspects seemingly never run out of ammo? They seem to switch to their sidearms, but I've never encountered one actually stop shooting because of no ammo or any weapons they've dropped with the bolt locked back.\n\nAnd yet another note, it seems to me like the pepper ball launchers are pretty much all but unusable in comparison to the beanbag shotgun. They really just don't seem like they're worth using. And as much as I love to blast suspects with the wide variety of lethal weapons, the non-lethal weapons really need some more diversity. Three nonlethal weapons (Not counting launchers, which are also pretty middling) is honestly pretty prohibitive and can get repetitive quick, especially since in commander mode (The only mode in which I and most people play), The only way to get your team to activate their perks are basically to get S ranks on missions back to back (Requiring no dead suspects).\n\nMy final but by far smallest gripe, every time you load into the department you hear a female officer say \"Christ, it's really kicking off out there\", In my own head canon, It's some sort of autistic fixation of hers to say those words in the exact same intonation every time Judge walks through the front doors. Some variation in voice lines for officers at the station and on your team would go a long way.\n\nRevised to change a few words around and add in a few more gripes.\n\nLove this game, hope it continues to improve and get some needed updates to the AI."}, {"id": "R013", "text": "PEAK GAME! Very complex but fun even for beginners if you dont have the ambition to understand every mechanic you encounter from the start."}, {"id": "R101", "text": "Accuracy"}, {"id": "R138", "text": "91"}, {"id": "R131", "text": "Never played a Fromsoft game before, and although I'm having fun, there are some issues I'm not seeing people talk about that I think should be mentioned. From most to least frustrating:\n1. Consumables are awful. I hated them in Silksong, and I hate them here. I propose that they should not be permanently removed from your inventory after death unless you've made some permanent progress (beating a boss, touching a grace, etc.).\n2. Abysmal keyboard controls. I've found a setup that works for me, but it's still very problematic. If I could bind multiple keys to the same action, or access the quick items without holding the interact button, it would be much better.\n3. The 60 fps cap is stupid. Modders have fixed this issue. I've gotten used to it, but Fromsoft has no excuse.\n4. Last, least, and most confusing, why is there no option for glyphs to automatically switch based on whether you're using a keyboard or controller? I also own a Legion Go, so if I want the glyphs to be accurate, I have to change a setting AND THE SETTING IS SYNCED BETWEEN DEVICES????\n\nOverall, I like Elden Ring, and I'm interested to try Fromsofts other games, but these issues do not inspire confidence."}, {"id": "R085", "text": "[table]\n[tr]\n    [td]\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\nhttps://www.youtube.com/watch?v=qw5RSMvv5tY&list=RDqw5RSMvv5tY&start_radio=1\n\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800[/td]\n[/tr]\n[tr]\n    [td]"}, {"id": "R136", "text": "great"}, {"id": "R021", "text": "\u4ed6\u5988\u8001\u662f\u51fabug\uff0c\u70e6\u6b7b\u4e86\uff0c\u9f99\u4e5f\u5f88\u5bb9\u6613\u4e22\uff exactly like Mount & Blade: Warband, just with better graphics and a more modern presentation. The core gameplay, combat, and overall gameplay loop feel remarkably similar, and after playing it, I struggle to understand what makes this worth such a high price. I expected a sequel to bring more meaningful improvements and a genuinely different experience, but instead, it feels like I\u2019m paying a premium to play essentially the same game I played years ago. The combat doesn\u2019t feel particularly revolutionary, and much of the gameplay feels like a repeat of Warband with a fresh coat of paint.\nI understand that there are improvements to graphics, battles, and certain systems, but personally, they aren\u2019t enough to justify the price. For a game this expensive, I expected more substantial changes to the core experience.\n\nIf you already own Warband, I\u2019d have a hard time recommending Bannerlord at full price unless you\u2019re specifically looking for better graphics and larger-scale battles. For me, the overall experience just doesn\u2019t feel different enough to justify the cost."}, {"id": "R062", "text": "\u6e38\u620f\u4e0d\u9519  \u4f46\u662f\u767b\u4e0d\u4e0a\u6e38\u620f^-^"}, {"id": "R145", "text": "Oh yeah\r\n"}, {"id": "R018", "text": "\u7ae5\u5e74\u795e\u4f5c\uff0c\u79d1\u5e7b\u5c04\u51fb\u7c7b\u767d\u6708\u5149\u3002\uff0c\u867d\u7136\u65e9\u671f\u7684\u51e0\u90e8\u6307\u5f15\u5dee\u4e86\u70b9\uff0c\u4f46\u5267\u60c5\u8db3\u591f\u7cbe\u5f69\u3002\u53f2\u4f4e29\u4e70\u7684\uff0c\u5305\u542b\u4e865\u90e8\uff0c\u5149\u4e00\u4e2a\u5149\u73af4\u5c31\u56de\u672c\u4e86\uff01\u4e5f\u662f\u6e38\u620f\u6027\u80fd\u6700\u597d\u7684\u4e00\u90e8\u3002"}, {"id": "R117", "text": "\u597d\u73a9\u7231\u73a9"}, {"id": "R066", "text": "\u71ac\u8fc7\u65b0\u624b\u6559\u7a0b\u5f00\u542f\u771f\u6b63\u7684\u6e38\u620f"}, {"id": "R140", "text": "A game about a sad kid fighting poop based enemy is my cup of tea. 10/10 I am losing my life to it"}, {"id": "R015", "text": "\u5de7\u514b\u529b\u5473\u9053\u7684\u5c4e\uff0c\u6e38\u620f\u7684\u52a8\u4f5c\u4ea4\u4e92\u8fd8\u53ef\u4ee5\uff0c\u4f46\u662f\u5145\u6ee1\u4e86\u4e3a\u4e86\u6076\u5fc3\u4eba\u800c\u6076\u5fc3\u4eba\u7684\u8bbe\u5b9a\uff0c\u5982\u4eca\u6709\u5f88\u591a\u66f4\u597d\u7684\u66ff\u4ee3\u54c1\uff0c\u6ca1\u5fc5\u8981\u4e3a\u4e86\u5403\u5c4e\u4e13\u95e8\u53bb\u73a9"}, {"id": "R104", "text": "Very fun"}, {"id": "R031", "text": "666"}, {"id": "R023", "text": "\u5f88\u4e45\u6ca1\u90a3\u4e48\u4e0a\u5934\u73a9\u6e38\u620f\u4e86\u3002\u3002\u3002\u770b\u6765\u73a9\u4e0d\u52a8\u6e38\u620f\u8fd8\u662f\u54c1\u8d28\u4e0d\u591f"}, {"id": "R143", "text": "Half-Life 2 feels like a rampage of creativity and ambition, the kind of game that still seems to come from somewhere else, like the Voyager probes: so well made it never really stopped traveling. The blue palette, the clockwork mechanics, the sheer megalomania of its world keep pulling me back.\nValve was a myth to me as a kid. Even now, with Deadlock, Alyx shifting the lore and Episode 3 still missing, I'm waiting to see what the devs do next.\nI first played it on a pirated copy. I bought it later, which is why I'm writing this."}, {"id": "R061", "text": "Its a great for a reason"}, {"id": "R148", "text": "66666"}, {"id": "R156", "text": "10/10 - bought it 2015 thought \"nah\" - played it 2026 - understand the hype now. Better play it!"}, {"id": "R029", "text": "good"}, {"id": "R065", "text": "\u76d6\u91d1\u6211\u64cd\u4f60\u5988"}, {"id": "R134", "text": "\u611f\u8c22\u62c9\u745e\u5b89\uff0c\u6ee1\u8db3\u4e86\u6211\u4e00\u76f4\u4ee5\u6765\u6e34\u671b\u8fdb\u884c\u4e00\u573a\u4e2d\u571f\u4e16\u754c\u5192\u9669\u7684\u5c0f\u5c0f\u9057\u61be\uff0c\n  \u6e38\u620f\u7b80\u76f4\u8d85\u51fa\u4e86\u6211\u7684\u9884\u671f\uff0c\u6211\u771f\u7684\u540e\u6094\u6253\u6298\u4e70\u5b83\u4e86\uff0c\u539f\u4ef7\u5165\u624b\u4e00\u70b9\u4e0d\u8fc7\u5206\u3002\u5982\u679c\u4f60\u662f\u60f3\u5e72\u7ffb\u6211\u5fc3\u76ee\u4e2d\u7684\u6240\u6709\u6e38\u620f\uff0c\u7136\u540e\u7406\u6240\u5e94\u5f53\u7684\u62ff\u4e0btop 1\uff0c\u90a3\u4e48\u4f60\u771f\u7684\u6210\u529f\u4e86\u3002\u8d8a\u73a9\u5230\u6700\u540e\u6211\u771f\u7684\u662f\u8d8a\u4e0d\u820d\u5f97\u901a\u5173\uff0c\u660e\u660e\u4f60\u505a\u4e86\u90a3\u4e48\u591a\u7ec6\u8282\u6ee1\u6ee1\u3001\u5185\u5bb9\u4e30\u5bcc\u7684\u5730\u56fe\uff0c\u4f46\u6211\u8fd8\u662f\u89c9\u5f97\u5730\u56fe\u592a\u5c0f\u592a\u5c11\u4e86\uff0c\u4f60\u4e5f\u8ba9\u6211\u7406\u89e3\u4e86\u4e3a\u4ec0\u4e48\u771f\u7684\u6709\u4eba\u4f1a\u5728\u4e00\u4e2a\u6e38\u620f\u4e0a\u73a9\u4e0a1\u5343\u5c0f\u65f6\u3002\u76f8\u6bd4\u4e8e\u7ed3\u5c40\u7684\u529f\u6210\u540d\u5c31\uff0c\u6211\u66f4\u559c\u6b22\u50cf\u53ea\u5c0f\u8001\u9f20\u4e00\u6837\u6f2b\u65e0\u76ee\u7684\u5728\u5730\u56fe\u91cc\u9762\u95f2\u901b\uff0c\u770b\u770b\u4e0d\u540c\u7684\u98ce\u666f\uff0c\u542c\u542c\u65e0\u5173\u7d27\u8981\u7684\u95f2\u804a\uff0c\u5076\u5c14\u53d1\u73b0\u4e00\u4e9b\u5f00\u53d1\u8005\u7559\u4e0b\u7684\u5f69\u86cb\uff0c\u7136\u540e\u5fc3\u9886\u795e\u4f1a\u7684\u76f8\u89c6\u4e00\u7b11\u3002\n  \u6700\u540e\u7ed3\u5c40\u65f6\u523b\uff0c\u770b\u7740\u8eab\u8fb9\u7684\u961f\u53cb\u5404\u5954\u524d\u7a0b\uff0c\u4eba\u53bb\u697c\u7a7a\uff0c\u56de\u60f3\u6211\u4eec\u66fe\u7ecf\u4f1f\u5927\u7684\u5192\u9669\u6211\u7b80\u76f4\u8981\u54ed\u51fa\u6765\u4e86\uff0c\u4e5f\u8ba9\u6211\u60f3\u8d77\u6c34\u6d52\u4f20\u6700\u540e\u7684\u6536\u5c3e\u8bd7\uff1a\n  \u5929\u7f61\u5c3d\u5df2\u5f52\u5929\u754c\uff0c\u5730\u715e\u8fd8\u5e94\u5165\u5730\u4e2d\uff1b\n  \u5343\u53e4\u4e3a\u795e\u7686\u5e99\u98df\uff0c\u4e07\u5e74\u9752\u53f2\u64ad\u82f1\u96c4\u3002\n\uff08ps. \u6c42\u4f60\u4e86\uff0c\u5feb\u51faBG4\u5427\uff0c\u6211\u4ec0\u4e48\u90fd\u4f1a\u505a\u7684\uff0c\u5b9e\u5728\u4e0d\u884c\u4e5f\u53ef\u4ee5\u5b66\u5b66\u9694\u58c1\u5361\u5a4a\uff0c\u628aBG1\u30012\u91cd\u7f6e\u4e00\u904d\u7092\u51b7\u996d\u6211\u4e5f\u613f\u610f\uff0c\u6211\u771f\u7684\u4ec0\u4e48\u90fd\u4f1a\u505a\u7684\uff09"}, {"id": "R005", "text": "\u597d\u73a9\uff01\r\n"}, {"id": "R160", "text": "\u5783\u573e\u6e38\u620f"}, {"id": "R056", "text": "1123123123123213213123123123123123213123123123"}, {"id": "R034", "text": "11"}, {"id": "R153", "text": "INI GAME SERU BANGET!!! Cocok untuk kalian yang ingin game roguelike/roguelite tapi super ringan dan seru! (Tapi, emang butuh kesabaran, sih. Soalnya, inti dari game ini adalah BERTARUNG, MATI, ULANGI)"}, {"id": "R150", "text": "https://steamcommunity.com/sharedfiles/filedetails/?id=3397371571"}, {"id": "R146", "text": "\u5783\u573e\u6e38\u620f \u5404\u79cdbug \u5404\u79cd\u8df3\u8f93\u5165\u6cd5\u3002"}, {"id": "R028", "text": "\u4e0a\u5934\uff0c\u975e\u5e38\u4e0a\u5934\u3002"}, {"id": "R052", "text": "FUN"}, {"id": "R081", "text": "This is very difficult game to start....I`m playing solo and cant do most of the dungeons , but still going for it. I wish their were a easier difficulty setting but it is what it is. The locations through out are a amazing to look at. This is worth playing , I get lost in time!!!!"}, {"id": "R127", "text": "very good"}, {"id": "R033", "text": "\u6211\u5f88\u559c\u6b22\u8fd9\u4e2a\u6e38\u620f\uff0c\u4f46\u662f\u6700\u559c\u6b22\u7684\u65f6\u5019\u662f\u4ed6\u80fd\u8d85\u8fc7 4 \u4e2a\u4eba\u8054\u673a\u7684\u65f6\u5019\uff0c\u6211\u4eec\u90fd\u6709 4 \u4e2a\u4ee5\u4e0a\u7684\u670b\u53cb\uff0c\u4f46\u662f\u80fd\u8d85\u8fc7 4 \u4eba\u8054\u673a\u7684\u6e38\u620f\u5374\u5f88\u5c11\uff0c\u6211\u4eec\u9700\u8981\u66f4\u591a\u7684\u8054\u673a\u4eba\u6570\u3002\r\nI really love this game, but I enjoyed it the most when it supported lobbies of more than four players. We have groups of more than four friends, yet there aren\u2019t many games that allow over four people to play together. We want more games with higher player limits for multiplayer."}, {"id": "R122", "text": "\u5e0c\u814a\u795e\u8bdd\u4e4b\u4eba\u4eba\u90fd\u7231\u51a5\u754c\u738b\u5b50"}, {"id": "R010", "text": "\u52c7\u767b\u9ad8\u5cf0"}, {"id": "R011", "text": "I never really got into turn based games until i played Darkest Dungeon I like the story, map, vibe and many other parts of the game. Even when i lose or have to retreat I'll still earn something. The stress aspect is also a challenge i enjoy managing/working around"}, {"id": "R105", "text": "\u795e\u4f5c"}, {"id": "R159", "text": "really nice game"}, {"id": "R100", "text": "\u8001\u6e38\u620f\u4e86\uff0c\u73a9\u4e0d\u8fdb\u53bb\uff0c\u8fd8\u6709\u5404\u79cd\u5c0fbug\u3002"}, {"id": "R135", "text": "A perfectly balanced game with ZERO bugs"}, {"id": "R054", "text": "\u73a9\u4e0d\u817b"}, {"id": "R109", "text": "The community is awful, and the mute system is even worse. I've been unable to use voice chat for what feels like forever. Communication is essential in a competitive game, yet Valve's system makes it impossible for some players to communicate for months on end. Fix your damn game."}, {"id": "R139", "text": "111"}, {"id": "R063", "text": "As a long time diablo player, this game scratches my itch.  I like the skill tree."}, {"id": "R103", "text": "\u4e00\u3001\u6838\u5fc3\u73a9\u6cd5\u5faa\u73af\r\n\u73a9\u5bb6\u626e\u6f14\u9ed1\u5ba2 Marcus Holloway\uff0c\u5728\u65e7\u91d1\u5c71\u6e7e\u533a\u6267\u884c DedSec \u7684\u884c\u52a8\u3002\u6838\u5fc3\u5faa\u73af\u4e3a\uff1a\u63a5\u53d6\u884c\u52a8\uff08\u6f5c\u5165\u6212\u5907\u68ee\u4e25\u7684\u5efa\u7b51\u3001\u63d0\u53d6\u6216\u7834\u574f\u6570\u636e\uff09\u2192 \u8fd0\u7528\u9ed1\u5ba2\u5de5\u5177\u7bb1\u5316\u89e3\u5a01\u80c1 \u2192 \u5b8c\u6210\u4efb\u52a1 \u2192 \u7d2f\u79ef\"\u7c89\u4e1d\uff08Followers\uff09\"\u2192 \u89e3\u9501\u66f4\u5f3a\u529b\u3001\u66f4\u8fdc\u7a0b\u7684\u9ed1\u5ba2\u80fd\u529b\u3002\r\n- \u9ed1\u5ba2\u5de5\u5177\u7bb1\uff1a\u667a\u80fd\u624b\u673a\u8fdc\u7a0b\u5165\u4fb5\uff08\u7ea2\u7eff\u706f\u3001\u6444\u50cf\u5934\u3001ctOS \u8054\u7f51\u8bbe\u5907\uff09\u3001\u56db\u8f74\u65e0\u4eba\u673a\uff08\u9ad8\u7a7a\u4fa6\u5bdf / \u6807\u8bb0\uff09\u3001RC Jumper \u8df3\u8df3\u8f66\uff08\u72ed\u5c0f\u7a7a\u95f4\u6f5c\u5165\uff09\u3001\u73af\u5883\u9677\u9631\uff08\u7206\u70b8\u7ba1\u9053\u3001\u53c9\u8f66\u3001\u540a\u8f66\uff09\u4e0e\u793e\u4f1a\u5de5\u7a0b\u3002\r\n- \u4e09\u79cd\u63a8\u8fdb\u98ce\u683c\uff1a\u5e7d\u7075\uff08\u5168\u7a0b\u4e0d\u8fdb\u5165\u533a\u57df\uff09\u3001\u6f5c\u884c\u3001\u4ee5\u53ca\u6b63\u9762\u706b\u62fc\u2014\u2014\u6279\u8bc4\u666e\u904d\u8ba4\u4e3a\u6218\u6597\u662f\u6700\u5f31\u7684\u4e00\u73af\uff0c\u6e38\u620f\u6700\u4f73\u4f53\u9a8c\u6765\u81ea\u975e\u81f4\u547d\u7684\u667a\u53d6\u3002\r\n- \u7c89\u4e1d\u7cfb\u7edf\u5373\u8fdb\u5ea6\u673a\u5236\uff1a\u7c89\u4e1d\u8d8a\u591a\uff0c\u9ed1\u5ba2\u8303\u56f4\u4e0e\u5f3a\u5ea6\u8d8a\u5927\uff0c\u5f62\u6210\u6e05\u6670\u7684\u6210\u957f\u66f2\u7ebf\u3002\r\n- \u4efb\u52a1\u4e0e\u6a21\u5f0f\uff1a\u4e3b\u7ebf\u884c\u52a8\u3001\u652f\u7ebf\u4e16\u754c\u6545\u4e8b\u3001\u53cc\u4eba\u65e0\u7f1d\u5408\u4f5c\uff08\u81ea\u7531\u6f2b\u6e38 / \u5408\u4f5c\u884c\u52a8\uff09\u3001\u53ef\u9009 PvP \u5165\u4fb5\uff08\u8d4f\u91d1\u730e\u6740 / \u9ed1\u5ba2\u7ade\u901f\uff09\uff0c\u4ee5\u53ca\u6536\u96c6\u54c1\u4e0e\u8d5b\u8f66\u7b49\u3002\r\n- \u5408\u4f5c\u4e0e PvP\uff1a\u652f\u6301\u53cc\u4eba\u65e0\u7f1d Drop-in \u5408\u4f5c\uff1bPvP \u5165\u4fb5\u4e3a\u53ef\u5173\u95ed\u7684\u53ef\u9009\u5185\u5bb9\u3002\r\n\u4e8c\u3001\u753b\u9762\u4e0e\u97f3\u6548\u8868\u73b0\r\n\u753b\u9762\uff1a\u660e\u4eae\u3001\u9c9c\u6d3b\u7684\u65e7\u91d1\u5c71\u6e7e\u533a\u590d\u523b\uff08\u91d1\u95e8\u5927\u6865\u3001\u6e14\u4eba\u7801\u5934\u3001\u7845\u8c37\u5199\u5b57\u697c\uff09\uff0c\u8857\u5934\u52a8\u6001\uff08\u6d82\u9e26\u3001\u8def\u4eba\u3001\u6491\u4f1e\u5e02\u6c11\uff09\u8425\u9020\u51fa\"\u57ce\u5e02\u65c5\u6e38\u6a21\u62df\u5668\"\u822c\u7684\u771f\u5b9e\u611f\uff1b\u7f8e\u672f\u98ce\u683c\u4e3a\u98ce\u683c\u5316\u5199\u5b9e\uff0c\u6c1b\u56f4\u8f7b\u677e\u3002\u4e0d\u8db3\uff1a\u590d\u6742\u573a\u666f\u4e2d\u89c6\u89c9\u4fe1\u606f\u5bc6\u5ea6\u9ad8\uff0c\u5b88\u536b\u7684\u7ea2\u8272\u63cf\u8fb9\u96be\u4ee5\u8fa8\u8bc6\uff0c\u5f71\u54cd\u6f5c\u884c\u5224\u65ad\uff1b\u8fc7\u573a\u4e3a 16:9 \u5e26\u9ed1\u8fb9\uff0c\u8d85\u5bbd\u5c4f\u4e0e HDR \u9700\u501f\u52a9 Mod \u624d\u80fd\u8f83\u597d\u652f\u6301\u3002\r\n\u97f3\u6548\uff1a\u539f\u58f0\u4e0e\u7535\u53f0\u914d\u4e50\u5e7f\u53d7\u597d\u8bc4\uff0c\u8d34\u5408\u79d1\u5e7b / \u6076\u641e\u57fa\u8c03\uff1b\u73af\u5883\u97f3\u4e0e\u9ed1\u5ba2\u63d0\u793a\u53cd\u9988\u5230\u4f4d\u3002\u6574\u4f53\"\u4e0d\u62d6\u540e\u817f\"\uff0c\u4f46\u65e0\u7a81\u7834\u6027\u8868\u73b0\u3002\r\n\u4e09\u3001\u6027\u80fd\u4e0e\u4f18\u5316\r\n- \u786c\u4ef6\u95e8\u69db\u4f4e\uff1a\u5b98\u65b9\u6700\u4f4e\u4e3a GTX 660 / HD 7870 + 6GB \u5185\u5b58\uff0c\u63a8\u8350 GTX 780 / R9 290 + 8GB\uff1b50GB \u5b89\u88c5\u4f53\u79ef\u3002\u5728\u4e3b\u6d41\u53ca\u65e7\u786c\u4ef6\u4e0a 1080p \u6d41\u7545\uff0cPC \u79fb\u690d\u5728\u65e9\u671f\u88ab\u8bc4\u4ef7\u4e3a\u987a\u7545\u3002\r\n- \u7269\u7406\u5e27\u7387\u4e0a\u9650\uff1a\u6e38\u620f\u7269\u7406\u6309 60 FPS \u8bbe\u8ba1\uff0c\u9ad8\u4e8e\u6b64\u5e27\u7387\u53ef\u80fd\u5bfc\u81f4\u5e03\u5a03\u5a03 / NPC \u5f02\u5e38\u3002\r\n- \u73b0\u4ee3\u786c\u4ef6\u5df2\u77e5\u95ee\u9898\uff082026 \u5e74\u73a9\u5bb6\u9700\u91cd\u70b9\u5173\u6ce8\uff09\uff1a\r\n  - NVIDIA RTX 30 / 40 / 50 \u7cfb\u4e25\u91cd\u95ea\u70c1\uff1a\u5929\u7a7a\u76d2\u4e0e\u9634\u5f71\u6301\u7eed\u9ad8\u9891\u95ea\u70c1\uff0c\u5b98\u65b9\u81f3\u4eca\u672a\u4fee\u590d\uff1b\u793e\u533a workaround \u4e3a NVIDIA Profile Inspector \u9a71\u52a8\u7ea7\u8986\u76d6\uff0c\u6216 DXVK \u5305\u88c5\uff08\u4f46\u4f1a\u7981\u7528\u8054\u673a / EAC\uff09\u3002\r\n  - AMD \u663e\u5361\u5d29\u6e83\uff1a\u53ef\u901a\u8fc7\u4fee\u6539 WD2_GamerProfile.xml \u4e2d DeferredFxQuality=\"pc\" \u7f13\u89e3\u3002\r\n  - \u5361\u987f\uff1a\u5efa\u8bae\u88c5\u4e8e SSD\u3001\u5173\u95ed\u591a\u4eba\u529f\u80fd\u6216 EAC\u3001\u5bf9\u8fdb\u7a0b\u5173\u95ed Control Flow Guard\u3002\r\n  - Windows 11 24H2 \u542f\u52a8\u5f02\u5e38\u3001\u73b0\u4ee3 Core i9 \u7684 E-core \u8c03\u5ea6\u95ee\u9898\uff08\u53ef\u7528 Process Lasso \u4ec5\u4fdd\u7559 P-core\uff09\u7b49\u4ea6\u89c1\u62a5\u544a\u3002\r\n- \u7efc\u5408\u6765\u770b\uff1a\u672c\u4f5c\u5728\"\u80fd\u8dd1\"\u7684\u65e7\u786c\u4ef6\u4e0a\u4f53\u9a8c\u7a33\u5b9a\uff0c\u4f46\u5728\u65b0 GPU / \u65b0\u7cfb\u7edf\u4e0a\u9700\u624b\u52a8\u8c03\u6821\uff0c\u95e8\u69db\u4e3b\u8981\u4f53\u73b0\u4e3a\u517c\u5bb9\u6027\u95ee\u9898\u800c\u975e\u6027\u80fd\u4e0d\u8db3\u3002\r\n\u56db\u3001\u4ed8\u8d39\u6a21\u5f0f\u4e0e DLC\uff08\u4e70\u65ad\u5236\uff09\r\n- \u6027\u8d28\uff1a\u4e00\u6b21\u6027\u4e70\u65ad\u5236\uff0c\u975e\u514d\u8d39\u6e38\u620f\uff1bDLC \u4e3a\u989d\u5916\u4ed8\u8d39\u5c42\u3002\u539f\u4ef7\u7ea6 $60/\u00a340\uff0c\u73b0\u5e38\u5e74\u6df1\u5ea6\u6298\u6263\uff08\u5b8c\u6574 Gold \u7248\u5728\u4fc3\u9500\u671f\u5e38\u4f4e\u4e8e $5\uff09\u3002\r\n- \u7248\u672c\u5dee\u5f02\uff1a\r\n  - \u6807\u51c6\u7248\uff1a\u6e38\u620f\u672c\u4f53\u3002\r\n  - \u8c6a\u534e\u7248\uff08Deluxe\uff09\uff1a\u672c\u4f53 + Deluxe Pack\uff08\u4ec5\u5916\u89c2\uff09\u3002\r\n  - \u9ec4\u91d1\u7248\uff08Gold\uff09\uff1a\u672c\u4f53 + Deluxe Pack + \u5b63\u7968\uff08Season Pass\uff09\u3002\r\n- \u5b63\u7968\u5185\u5bb9\uff1a\u5341\u4e8c\u5bab\u6740\u624b\u4efb\u52a1\u3001Defalt \u5957\u88c5\u3001\u8f7d\u5177\u4e0e\u6b66\u5668\u76ae\u80a4\u3001T-Bone \u5185\u5bb9\u5305\uff08\u542b Mayhem \u5408\u4f5c\u96be\u5ea6\uff09\u3001Human Conditions\uff083 \u6bb5\u4e16\u754c\u6545\u4e8b + \u7cbe\u82f1\u5408\u4f5c\uff09\u3001No Compromise\uff08\u4fc4\u9ed1\u5e2e\u4e16\u754c\u6545\u4e8b + Showd0wn \u5408\u4f5c\u6a21\u5f0f\uff09\u3002\r\n- \u5916\u89c2\u5305\uff1a\u5927\u91cf Mega / Supreme / Ultimate \u7b49\u6346\u7ed1\u5305\uff0c\u5747\u4e3a\u7eaf\u5916\u89c2\uff1bUltra \u6750\u8d28\u5305\u514d\u8d39\u3002\r\n- \u5185\u8d2d\u6807\u6ce8\uff1aSteam \u9875\u9762\u5e26\u6709 \"In-App Purchases\" \u7c7b\u522b\uff08Ubisoft Connect \u5185\u53ef\u80fd\u5b58\u5728\u5c11\u91cf\u4fbf\u5229 / \u5916\u89c2\ 5728\u9002\u914d\u786c\u4ef6\u4e0a PC \u79fb\u690d\u987a\u7545\u3001\u914d\u7f6e\u95e8\u69db\u4f4e\u3002\r\n\u7f3a\u70b9\r\n1. \u6218\u6597 / \u5c04\u51fb\u624b\u611f\u6700\u5f31\uff1a\u89d2\u8272\u504f\u8106\u3001\u65e0\u7ffb\u6eda\u3001\u654c\u4eba\u7ed5\u4fa7\u660e\u663e\u3002\r\n2. \u73b0\u4ee3\u786c\u4ef6\u517c\u5bb9\u6027\u5dee\uff1aRTX 30/40/50 \u95ea\u70c1\u3001AMD \u5d29\u6e83\u3001W11 24H2 \u542f\u52a8\u3001E-core \u8c03\u5ea6\u7b49\u9700\u624b\u52a8\u4fee\u590d\u3002\r\n3. DRM \u53e0\u5c42\uff08Ubisoft Connect + Denuvo + EAC\uff09\u5e26\u6765\u542f\u52a8\u6469\u64e6\u3002\r\n4. \u6f5c\u884c\u5076\u6709\"\u6d41\u7a0b\u5316\"\u611f\uff0c\u573a\u666f\u8fa8\u8bc6\u5ea6\u4f4e\u5f71\u54cd\u4f53\u9a8c\u3002\r\n5. \u652f\u7ebf\u91cd\u590d\u3001\u4e3b\u7ebf\u5f20\u529b\u5f31\u3001\u53cd\u6d3e\u8138\u8c31\u5316\u3002\r\n6. \u5df2\u505c\u6b62\u4e3b\u52a8\u7ef4\u62a4\uff0c\u5df2\u77e5 Bug \u957f\u671f\u672a\u4fee\uff1b\u7269\u7406\u9501 60 FPS\u3002\r\n\u9002\u5408\u73a9\u5bb6\u7fa4\u4f53\r\n\u9002\u5408\uff1a\r\n- \u559c\u7231\u5f00\u653e\u4e16\u754c\u6c99\u76d2\u3001\u5f3a\u8c03\"\u81ea\u7531\u89e3\u6cd5\"\u7684\u73a9\u5bb6\uff1b\r\n- \u504f\u597d\u6f5c\u884c / \u975e\u81f4\u547d\u667a\u53d6\u3001\u538c\u6076\u65e0\u8111\u67aa\u6218\u7684\u73a9\u5bb6\uff1b\r\n- \u770b\u91cd\u5408\u4f5c PvE\u3001\u8f7b\u677e\u5e7d\u9ed8\u57fa\u8c03\u4e0e\u5b9e\u9a8c\u6027\u73a9\u6cd5\u7684\u73a9\u5bb6\uff1b\r\n- \u8d81\u6df1\u5ea6\u6298\u6263\u4f4e\u4ef7\u5165\u5e93\u3001\u8ffd\u6c42\u6027\u4ef7\u6bd4\u7684\u73a9\u5bb6\u3002\r\n\u4e0d\u9002\u5408\uff1a\r\n- \u4ee5\u67aa\u6218\u624b\u611f / \u5c04\u51fb\u723d\u5feb\u5ea6\u4e3a\u9996\u8981\u8bc9\u6c42\u7684\u73a9\u5bb6\uff1b\r\n- \u671f\u671b\u73b0\u4ee3\u6e38\u620f\u6301\u7eed\u7ef4\u62a4\u3001\u5f00\u7bb1\u5373\u7a33\u7684\u73a9\u5bb6\uff1b\r\n- \u53cd\u611f\u542f\u52a8\u5668 / DRM \u6469\u64e6\u3001\u9700\u8981\u539f\u751f\u8d85\u5bbd\u5c4f\u6216 HDR \u7684\u73a9\u5bb6\uff1b\r\n- \u8ffd\u6c42\u5f3a\u53d9\u4e8b\u5f20\u529b\u6216 PvE \u7ec8\u5c40\u6df1\u5ea6\u7684\u73a9\u5bb6\u3002\r\n\u5c0f\u7ed3\uff1a\u4f5c\u4e3a\u4e00\u6b3e\u7ea6\u5341\u5e74\u524d\u53d1\u552e\u7684\u4e70\u65ad\u5236\u5f00\u653e\u4e16\u754c\u4f5c\u54c1\uff0c\u300aWatch Dogs 2\u300b\u51ed\u501f\u521b\u610f\u9ed1\u5ba2\u7cfb\u7edf\u3001\u9c9c\u6d3b\u7684\u65e7\u91d1\u5c71\u6e7e\u533a\u4e0e\u8f7b\u677e\u57fa\u8c03\uff0c\u4ecd\u662f\u80b2\u78a7\u5f00\u653e\u4e16\u754c\u4e2d\u7684\u9ad8\u70b9\u4e4b\u4e00\uff1b\u5176\u4f4e\u4ef7\u683c\u4e0e\u514b\u5236\u53d8\u73b0\u6784\u6210\u663e\u8457\u6027\u4ef7\u6bd4\u3002\u4e3b\u8981\u4e0d\u786e\u5b9a\u56e0\u7d20\u6765\u81ea\u4e24\u65b9\u9762\u2014\u2014\u4e00\u662f\u6218\u6597\u624b\u611f\u504f\u5f31\u3001\u53d9\u4e8b\u5f20\u529b\u4e0d\u8db3\uff0c\u4e8c\u662f\u73b0\u4ee3\u786c\u4ef6\uff08\u5c24\u5176 RTX 30/40/50 \u7cfb\uff09\u4e0a\u7684\u517c\u5bb9\u6027 Bug \u9700\u73a9\u5bb6\u81ea\u884c\u4fee\u590d\u3002\u662f\u5426\u5165\u624b\uff0c\u4e3b\u8981\u53d6\u51b3\u4e8e\u4f60\u80fd\u5426\u63a5\u53d7\"\u624b\u52a8\u8c03\u6821 + \u667a\u53d6\u4f18\u5148\"\u7684\u6e38\u73a9\u65b9\u5f0f\uff0c\u4ee5\u53ca\u662f\u5426\u770b\u91cd\u6298\u6263\u671f\u7684\u6781\u4f4e\u5165\u624b\u4ef7\u3002"}, {"id": "R058", "text": "\u63a8\u8350\uff0c\u975e\u5e38\u597d\u73a9\u3002\r\n\u5148\u8bf4\u7f3a\u70b9\uff0c\u4e00\u4e2a\u89d2\u8272\u73a9\u817b\u4e86\u60f3\u8bd5\u8bd5\u522b\u7684\u89d2\u8272\u9700\u8981\u5355\u5f00\u4e00\u4e2a\u6863\uff0c\u91cd\u65b0\u8fc7\u4e00\u904d\u5267\u60c5\uff0c\u867d\u7136\u53ef\u4ee5\u8df3\u8fc7\uff0c\u4f46\u8fd8\u662f\u6bd4\u8f83\u9ebb\u70e6\uff1b\u7136\u540e\u867d\u7136\u662f\u51fa\u4e86\u5f88\u4e45\u7684\u6e38\u620f\uff0c\u4f46\u793e\u533a\u7f3a\u4e4f\u8be6\u7ec6\u4e14\u70ed\u95e8\u7684\u653b\u7565\uff0c\u9700\u8981\u82b1\u4e00\u5b9a\u65f6\u95f4\u5728\u67e5\u653b\u7565\u4e0a\u3002\u8c01\u61c2\u641c\u653b\u7565\u7b2c\u4e00\u4e2a\u89c6\u9891\u70b9\u8fdb\u53bb\u8ddf\u7740\u8dd1\u56fe\u5237\u4e86\u51e0\u5341\u8f6e\u90fd\u6ca1\u51fa\uff0c\u53c8\u53bb\u67e5\u4e86\u9605\u89c8\u91cf\u5c0f\u5f88\u591a\u7684\u653b\u7565\uff0c\u7136\u540e\u770b\u8bc4\u8bba\u533a\u624d\u77e5\u9053\u8fd8\u6709\u524d\u7f6e\u4efb\u52a1\u3002\u867d\u7136\u505a\u653b\u7565\u662f\u7eaf\u70ed\u7231\uff0c\u4f46\u662f\u65e2\u7136\u8981\u505a\u81f3\u5c11\u8981\u505a\u5168\u5427\uff0c\u5f53\u7136\u4e5f\u4e0d\u6392\u9664\u8001\u8d44\u5386\u505a\u653b\u7565\u7684\u65f6\u5019\u8ddd\u79bb\u5f53\u65f6\u5df2\u7ecf\u8fc7\u4e86\u5f88\u4e45\uff0c\u90fd\u5fd8\u8bb0\u8981\u505a\u524d\u7f6e\u4efb\u52a1\u4e86\uff1b\u8fd8\u6709\u4e00\u4e2a\u7f3a\u70b9\u5c31\u662f\u8fd9\u662f\u4e2a\u5237\u5b9d\u6e38\u620f\uff0c\u4f46\u5237\u88c5\u5907\u5f88\u590d\u6742\u3002\u4f60\u6253\u5b8cboss\u6ca1\u51fa\uff0c\u8981\u9000\u56de\u6807\u9898\u518d\u91cd\u8fdb\u6e38\u620f\u5237\u65b0boss\uff0c\u8fd9\u4e00\u70b9\u6bd4\u8f83\u70e6\u3002\u5982\u679c\u662f\u5355\u4eba\u7684\u8bdd\uff0c\u53cd\u590d\u5237\u82b1\u4e0d\u4e86\u591a\u5c11\u65f6\u95f4\uff0c\u4f46\u662f\u591a\u4eba\u7684\u8bdd\u5c31\u4e0d\u884c\uff0c\u5f88\u9ebb\u70e6\uff08\u800c\u4e14\u8fd9\u6e38\u620f\u5c45\u7136\u8fd8\u662f\u9f13\u52b1\u8054\u673a\u7684\uff0c\u5728\u6e38\u620f\u8bf4\u660e\u4e2d\uff0c\u8054\u673a\u7684\u6389\u5b9d\u7387\u4f1a\u63d0\u5347\uff09\r\n\r\n\u7136\u540e\u662f\u4f18\u70b9\u3002\u5404\u4e2a\u89d2\u8272\u90fd\u5f88\u6709\u610f\u601d\uff0c\u53ef\u4ee5\u6784\u7b51\u4e0d\u540c\u7684\u6d41\u6d3e\u73a9\u6cd5\uff0c\u6bcf\u4e2a\u89d2\u8272\u90fd\u5f88\u6709\u7279\u70b9\uff1b\u5267\u60c5\u7684\u8bdd\u4e2d\u89c4\u4e2d\u77e9\uff0c\u800c\u4e14dlc\u91cc\u7684\u5267\u60c5\u6709\u70b9\u8fa3\u773c\u775b\uff0c\u4f46\u662f\u4e2d\u914d\u5f88\u6709\u610f\u601d\uff1b\u8bf4\u662f\u5237\u5b9d\u6e38\u620f\uff0c\u4f46\u5176\u5b9e\u4e5f\u53ef\u4ee5\u5f53\u4f5c\u662f\u5272\u8349\u6e38\u620f\u3002\u8c01\u61c2\u6784\u7b51\u597d\u60f3\u73a9\u7684\u6d41\u6d3e\u4e4b\u540e\uff0c\u5728\u6700\u9ad8\u96be\u5ea6\u7684\u602a\u5806\u91cc\u6e38\u9f99\u5272\u8349\u7684\u723d\u611f\u554a\uff01\r\n\r\n\u603b\u7684\u6765\u8bf4\uff0c\u6709\u4e00\u5b9a\u7f3a\u70b9\uff0c\u4f46\u662f\u503c\u5f97\u4e00\u73a9\u3002"}, {"id": "R082", "text": "Played civ 5, loved it and loved the mods.  Got civ6 ages ago, played it briefly and found it....not fun.  Tried again recently with some mods, but good god there are almost no mods and the ones that exist you have to jump through painful hoops to get to work properly, and they may not anyway - not blaming mod authors, seems like the game engine hates modding now.  The start of the end for the Civ series for sure, at least as I see it."}, {"id": "R006", "text": "There is so much I love about Palworld.\n\nIt\u2019s a complete one-time purchase without the relentless live-service grind\u2014no forced daily chores, time gates, or paywalls blocking features - I\u2019m so tired of that model. You just buy it and play at your own pace.\n\nThe world customization is awesome. You can tweak almost every server setting and difficulty slider across different worlds, whether you want a relaxed experience or a brutal survival challenge.\n\nBest of all, I was able to host a dedicated server for my family and friends so we can enjoy the game together.\n\nP.S. To the die-hard Pok\u00e9mon fans getting salty: a complete lack of competition is the exact reason Nintendo keeps giving you less for more. When there's no rival pushing them, you end up paying full price for mediocre releases. Palworld raising the bar is a good thing.\n\nI was one of those Pok\u00e9mon fans who kept wishing Nintendo would release something like this, but it never happened until Palworld came around."}, {"id": "R137", "text": ",,"}, {"id": "R069", "text": "I really dont know how people enjoy this. The guns feel horrible to use"}, {"id": "R064", "text": "it nice"}, {"id": "R158", "text": "used to be a good game, they even hung a plague on the wall for when they ruined the game. isnt a fun game anymore, and singleplayer isnt even worth playing cause your just going to die"}, {"id": "R059", "text": "\u589e\u5f3a\u7248\u524d\u5165\u7684\u73a9\u4e86\u4e8c\u5341\u4e2a\u5c0f\u65f6\u5f03\u5751\u4e86\uff0c\u66f4\u65b0\u4e86\u589e\u5f3a\u7248\u53c8\u6361\u8d77\u6765\u73a9\u7684\u3002\n\u753b\u9762\u63d0\u5347\u4e86\u5f88\u591a\uff0c\u6218\u6597\u4eba\u7269\u4e0d\u5982\u5c0f\u5f1f\u3002\u5c0f\u5f1f\u57f9\u80b2\u53c8\u5f88\u6162\u3002\u6709\u4e00\u4e9b\u6298\u78e8\u3002\n\u6ee1\u7ea760\u7ea7\uff0c\u6ee1\u7ea7\u4ee5\u540e\u5f3a\u5ea6\u4e5f\u5f88\u4e00\u822c\uff0c\u4e0d\u5982\u5f00\u653e\u7b49\u7ea7\uff0c\u54ea\u6015\u8981\u7684\u7ecf\u9a8c\u591a\uff0c\u4e5f\u597d\u8fc7\u5237\u53c8\u81ed\u53c8\u957f\u7684\u526f\u672c\uff0c\u53ea\u80fd\u83b7\u53d6\u4e00\u4e9b\u6750\u6599\u7684\u53cd\u9988\u9ad8\u4e00\u4e9b\u3002\n\u5efa\u9020\u5c5e\u4e8e\u7c7b\u578b\u91cc\u6bd4\u8f83\u4e30\u5bcc\u4e5f\u5f88\u7ec6\u817b\u7684\u3002"}, {"id": "R099", "text": "Fun game."}, {"id": "R071", "text": "\u6211\u66f4\u559c\u6b22\u8ddf\u6211\u4e00\u8d77\u73a9\u7684\u4eba"}, {"id": "R016", "text": "\u6bd4\u8f83\u809d\uff0c\u6ca1\u6709\u770b\u4e3b\u64ad\u73a9\u90a3\u4e48\u597d\u73a9"}, {"id": "R083", "text": "i love being shit at this"}, {"id": "R128", "text": "\u5168\u6b3e\u4e70\u9ece\u660e\u6740\u673a\u7684\u73a9\u5bb6\u4e00\u751f\u53ea\u54ed\u2026"}, {"id": "R107", "text": "\u287f\u28e7\u28b8\u2847\u28bb\u28ff\u281f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u28bf\u283f\u283f\u283f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u28ff\u28ff\u28ff\n\u2847\u28bf\u2800\u2847\u28b8\u285f\u28e0\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28df\u28db\u28db\u28cb\u28c9\u28c1\u2809\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u2809\u283b\u2898\u28df\u2847\u28ff\u28b9\u2889\n\u2847\u2818\u2800\u2801\u2808\u2801\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u2886\u2
